<!DOCTYPE html>
<html lang="uk">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CRM - Latiao Abandoned Carts Tracking</title>

  <!-- Force Cache Clear -->
  <script src="./js/cache-clear.js?v=1770212367080"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SortableJS for Drag & Drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { spicy: '#ff6b00' } } }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      font-family: 'Inter', sans-serif;
    }

    .sidebar-link {
      transition: all 0.2s;
    }

    .sidebar-link:hover {
      background: rgba(255, 107, 0, 0.1);
    }

    .sidebar-link.active {
      background: rgba(255, 107, 0, 0.15);
      color: #ff6b00;
      font-weight: 600;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    /* Kanban Animations */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-slide-up {
      animation: slideUp 0.2s ease-out;
    }
    
    /* Custom Scrollbar */
    .scrollbar-thin {
      scrollbar-width: thin;
    }
    
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }
    
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 10px;
    }
    
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
    
    /* Kanban card styles */
    .kanban-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }
    
    .kanban-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1);
    }
    
    /* SortableJS ghost (placeholder) */
    .sortable-ghost {
      opacity: 0.4;
      background: #fed7aa !important;
      border: 2px dashed #f97316 !important;
      border-radius: 0.75rem;
    }
    
    /* SortableJS chosen (being dragged) */
    .sortable-chosen {
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
      transform: rotate(2deg) scale(1.02);
      cursor: grabbing !important;
    }
    
    /* SortableJS dragging */
    .sortable-drag {
      opacity: 1 !important;
      box-shadow: 0 20px 40px -10px rgba(249, 115, 22, 0.3) !important;
    }
    
    /* Toast animations */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .animate-fade-in {
      animation: fade-in 0.2s ease-out;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen text-gray-900">
  <!-- Loading Screen -->

  <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center">

    <div class="text-center">

      <div class="animate-spin rounded-full h-16 w-16 border-4 border-spicy border-t-transparent mx-auto mb-4"></div>

      <p class="text-lg font-semibold text-gray-700">Завантаження CRM системи...</p>

    </div>

  </div>
  <!-- Login View -->

  <div id="login-view" class="hidden fixed inset-0 bg-gray-100 z-40 flex items-center justify-center px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

      <div class="text-center mb-6">
        <span class="text-5xl">🌶️</span>

        <h1 class="text-2xl font-bold mt-4">Latiao CRM</h1>

        <p class="text-gray-600 text-sm mt-2">Увійдіть для продовження</p>

      </div>

      <form id="login-form" class="space-y-4">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-spicy outline-none"
            placeholder="admin@latiao.ua" required>

        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
          <input type="password" id="password"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-spicy outline-none" placeholder="••••••"
            required>

        </div>

        <div id="login-error" class="text-red-500 text-sm hidden"></div>
        <button type="submit"
          class="w-full bg-spicy text-white py-3 rounded-lg font-bold hover:bg-orange-700 transition">Увійти</button>

      </form>

    </div>

  </div>
  <!-- Main App -->

  <div id="app" class="hidden">
    <!-- Sidebar -->

    <aside class="fixed top-0 left-0 h-screen w-64 bg-white border-r border-gray-200 z-30 flex flex-col">

      <div class="p-6 border-b border-gray-200 flex-shrink-0">

        <div class="flex items-center gap-2">
          <span class="text-3xl">🌶️</span>

          <div>

            <h1 class="text-xl font-bold">Latiao</h1>

            <p class="text-xs text-gray-500">Admin Panel</p>

          </div>

        </div>

      </div>
      <!-- Navigation -->

      <nav class="flex-1 overflow-y-auto p-4 space-y-1 scrollbar-hide">
        <a href="index.html#dashboard" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>Дашборд</span>
        </a>
        <a href="index.html#orders" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span>Замовлення</span>
        </a>
        <a href="index.html#products" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="package" class="w-5 h-5"></i>
          <span>Товари</span>
        </a>
        <a href="index.html#categories" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="folder" class="w-5 h-5"></i>
          <span>Категорії</span>
        </a>
        <a href="index.html#customers" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span>Клієнти</span>
        </a>
        
        <!-- CRM Link (Active) -->
        <a href="crm.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="briefcase" class="w-5 h-5"></i>
          <span>🎯 CRM Tracking</span>
        </a>
        
        <a href="index.html#stats" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          <span>📊 Статистика</span>
        </a>
        <a href="index.html#abandoned-carts" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <span>Покинуті кошики</span>
        </a>

      </nav>
      <!-- Logout -->

      <div class="flex-shrink-0 p-4 border-t border-gray-200 bg-white">
        <button id="logout-btn"
          class="w-full flex items-center gap-2 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span>Вийти</span>
        </button>

      </div>

    </aside>
    <!-- Main Content -->

    <main class="ml-64 min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
      <!-- Header -->

      <header class="bg-white border-b border-gray-200 px-8 py-6 sticky top-0 z-20 shadow-sm">

        <div class="flex items-center justify-between">

          <div>
            <h2 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
              🎯 CRM - Abandoned Carts Tracking
            </h2>
            <p class="text-sm text-gray-500 mt-1">Управління покинутими кошиками та відстеження конверсій</p>
          </div>

          <div class="flex items-center gap-4">
            <button onclick="refreshKanban()" class="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              <span class="text-sm font-semibold">Оновити</span>
            </button>
            <button onclick="openSettingsModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors" title="Налаштування">
              <i data-lucide="settings" class="w-5 h-5 text-gray-600"></i>
            </button>
          </div>

        </div>

      </header>
      <!-- CRM Kanban Board -->

      <div class="p-8">
        
        <!-- Stats Bar -->
        <div class="mb-6 bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <div id="stats-container" class="flex gap-6 overflow-x-auto scrollbar-thin">
            <!-- Stats will be dynamically generated -->
          </div>
        </div>
        
        <!-- Kanban Board (Horizontally Scrollable) -->
        <div class="relative">
          <div id="kanban-board-container" class="flex gap-6 overflow-x-auto pb-4 scrollbar-thin">
            <!-- Columns will be dynamically generated -->
          </div>
        </div>

      </div>

    </main>

  </div>
  
  <!-- Column Edit Modal -->
  <div id="column-edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-bold text-gray-900">✏️ Редагувати колонку</h3>
        <button onclick="closeColumnEditModal()" class="p-2 hover:bg-gray-100 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Назва колонки</label>
          <input type="text" id="column-title-input" 
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
            placeholder="Нова колонка">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Emoji</label>
          <input type="text" id="column-emoji-input" 
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
            placeholder="🆕" maxlength="2">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Опис</label>
          <input type="text" id="column-description-input" 
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
            placeholder="Опис колонки">
        </div>
      </div>
      
      <div class="mt-6 flex gap-3">
        <button onclick="saveColumnEdit()" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition">
          Зберегти
        </button>
        <button onclick="closeColumnEditModal()" class="px-4 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition">
          Скасувати
        </button>
      </div>
    </div>
  </div>

  <!-- Load CRM JavaScript Module -->
  <script type="module" src="./js/crm.js"></script>
  
  <script>
    // Initialize Lucide icons
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>

</body>

</html>
