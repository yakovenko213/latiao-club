<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upsell Debug - Latiao Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">🔍 Upsell System Debugger</h1>
    
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Firebase Connection</h2>
      <div id="firebase-status" class="text-gray-600">Connecting...</div>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Database Products Query</h2>
      <button onclick="checkProducts()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        🔍 Fetch Products from Firestore
      </button>
      <div id="products-result" class="mt-4"></div>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Current Cart Simulation</h2>
      <p class="text-sm text-gray-600 mb-2">Add product IDs to simulate cart:</p>
      <input 
        type="text" 
        id="cart-ids" 
        placeholder="product-1, product-2, product-3"
        class="w-full border border-gray-300 rounded px-3 py-2 mb-2"
      >
      <button onclick="testUpsell()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
        🎯 Test Upsell Algorithm
      </button>
      <div id="upsell-result" class="mt-4"></div>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-xl font-bold mb-4">Console Logs</h2>
      <div id="console-logs" class="bg-gray-900 text-green-400 p-4 rounded font-mono text-xs max-h-96 overflow-y-auto"></div>
    </div>
  </div>

  <!-- Firebase v9 Modular SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where, limit } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBGR-rZ8pWlhfgmTykZ47C4zVwO0MFnzI0",
      authDomain: "latiao-club.firebaseapp.com",
      projectId: "latiao-club",
      storageBucket: "latiao-club.firebasestorage.app",
      messagingSenderId: "450774285294",
      appId: "1:450774285294:web:44ae5a3d8f0aa7b63a6a8c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firebaseDB = { db, collection, getDocs, query, where, limit };
    
    document.getElementById('firebase-status').innerHTML = '✅ Connected to Firebase';
    log('✅ Firebase initialized successfully');

    // Logger function
    function log(message, type = 'info') {
      const logsEl = document.getElementById('console-logs');
      const color = type === 'error' ? 'text-red-400' : type === 'warn' ? 'text-yellow-400' : 'text-green-400';
      const timestamp = new Date().toLocaleTimeString();
      logsEl.innerHTML += `<div class="${color}">[${timestamp}] ${message}</div>`;
      logsEl.scrollTop = logsEl.scrollHeight;
      console.log(message);
    }
    window.log = log;

    // Check all products in database
    window.checkProducts = async function() {
      try {
        log('🔍 Fetching all products from Firestore...');
        const resultEl = document.getElementById('products-result');
        resultEl.innerHTML = '<div class="text-gray-600">Loading...</div>';

        const { db, collection, getDocs, query, where } = window.firebaseDB;
        const productsRef = collection(db, 'products');

        // Try compound query first
        let snapshot;
        let queryType = '';
        
        try {
          log('Attempting compound query: isActive == true AND stock > 0');
          const compoundQuery = query(
            productsRef,
            where('isActive', '==', true),
            where('stock', '>', 0)
          );
          snapshot = await getDocs(compoundQuery);
          queryType = 'Compound Query (isActive + stock)';
          log('✅ Compound query successful!');
        } catch (indexError) {
          log('⚠️ Compound query failed: ' + indexError.message, 'warn');
          log('Falling back to simple query: isActive == true only');
          
          const simpleQuery = query(
            productsRef,
            where('isActive', '==', true)
          );
          snapshot = await getDocs(simpleQuery);
          queryType = 'Simple Query (isActive only)';
          log('✅ Simple query successful');
        }

        log(`📦 Retrieved ${snapshot.size} documents from Firestore`);

        const products = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          products.push({
            id: doc.id,
            name: data.name,
            price: data.price,
            stock: data.stock,
            isActive: data.isActive,
            category: data.category
          });
        });

        // Display results
        let html = `
          <div class="mb-4">
            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded text-sm font-semibold">${queryType}</span>
            <span class="ml-2 text-gray-600">Total: ${products.length} products</span>
          </div>
        `;

        if (products.length === 0) {
          html += `
            <div class="bg-red-50 border border-red-200 rounded p-4">
              <p class="text-red-800 font-semibold">⚠️ No products found!</p>
              <p class="text-red-600 text-sm mt-2">Possible reasons:</p>
              <ul class="list-disc ml-5 text-red-600 text-sm">
                <li>No products have isActive = true</li>
                <li>All products have stock = 0</li>
                <li>Products collection is empty</li>
              </ul>
            </div>
          `;
        } else {
          html += '<div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200">';
          html += `
            <thead class="bg-gray-50">
              <tr>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-900">ID</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-900">Name</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-900">Price</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-900">Stock</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-900">Active</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-900">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
          `;

          products.forEach(p => {
            const stockNum = parseInt(p.stock) || 0;
            const isActive = p.isActive === true || p.isActive === 'true' || p.isActive === 1;
            const eligible = isActive && stockNum > 0;
            
            const statusBadge = eligible 
              ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">✅ Eligible</span>'
              : '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs">❌ Not Eligible</span>';

            html += `
              <tr class="${eligible ? 'bg-white' : 'bg-gray-50'}">
                <td class="px-4 py-2 text-xs text-gray-500">${p.id}</td>
                <td class="px-4 py-2 text-sm font-medium text-gray-900">${p.name || 'N/A'}</td>
                <td class="px-4 py-2 text-sm text-gray-900">${p.price || 0} грн</td>
                <td class="px-4 py-2 text-sm ${stockNum > 0 ? 'text-green-600' : 'text-red-600'}">${stockNum}</td>
                <td class="px-4 py-2 text-sm ${isActive ? 'text-green-600' : 'text-red-600'}">${isActive ? '✓' : '✗'}</td>
                <td class="px-4 py-2">${statusBadge}</td>
              </tr>
            `;
          });

          html += '</tbody></table></div>';

          // Summary
          const eligible = products.filter(p => {
            const stockNum = parseInt(p.stock) || 0;
            const isActive = p.isActive === true || p.isActive === 'true' || p.isActive === 1;
            return isActive && stockNum > 0;
          });

          html += `
            <div class="mt-4 p-4 bg-blue-50 rounded">
              <p class="text-blue-900 font-semibold">Summary:</p>
              <ul class="text-blue-800 text-sm mt-2 space-y-1">
                <li>✅ Eligible for upsell: <strong>${eligible.length}</strong> products</li>
                <li>❌ Not eligible: <strong>${products.length - eligible.length}</strong> products</li>
              </ul>
            </div>
          `;
        }

        resultEl.innerHTML = html;
        log(`✅ Displayed ${products.length} products`);

      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
        document.getElementById('products-result').innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded p-4">
            <p class="text-red-800 font-semibold">Error: ${error.message}</p>
          </div>
        `;
      }
    };

    // Test upsell algorithm
    window.testUpsell = async function() {
      try {
        log('🎯 Testing upsell algorithm...');
        const resultEl = document.getElementById('upsell-result');
        resultEl.innerHTML = '<div class="text-gray-600">Processing...</div>';

        const cartIdsInput = document.getElementById('cart-ids').value;
        const cartIds = cartIdsInput 
          ? cartIdsInput.split(',').map(id => id.trim()).filter(id => id)
          : [];

        log(`🛒 Simulated cart: ${cartIds.length} items (${cartIds.join(', ') || 'empty'})`);

        const { db, collection, getDocs, query, where } = window.firebaseDB;
        const productsRef = collection(db, 'products');

        // Get all products
        let snapshot;
        try {
          const compoundQuery = query(
            productsRef,
            where('isActive', '==', true),
            where('stock', '>', 0)
          );
          snapshot = await getDocs(compoundQuery);
        } catch {
          const simpleQuery = query(productsRef, where('isActive', '==', true));
          snapshot = await getDocs(simpleQuery);
        }

        const allProducts = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          const isActive = data.isActive === true || data.isActive === 'true' || data.isActive === 1;
          const stock = parseInt(data.stock) || 0;
          
          if (isActive && stock > 0) {
            allProducts.push({ id: doc.id, ...data });
          }
        });

        log(`📦 Found ${allProducts.length} eligible products`);

        // Filter out cart items
        const cartIdsSet = new Set(cartIds);
        const available = allProducts.filter(p => !cartIdsSet.has(p.id));

        log(`📦 After filtering cart: ${available.length} available products`);

        // Select 5 random
        const shuffled = available.sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, 5);

        log(`✅ Selected ${selected.length} products for upsell`);

        // Display
        let html = `
          <div class="mb-4 p-4 bg-gray-100 rounded">
            <p class="font-semibold mb-2">Algorithm Steps:</p>
            <ol class="text-sm space-y-1 list-decimal ml-5">
              <li>Total products in database: ${snapshot.size}</li>
              <li>Eligible (isActive + stock > 0): ${allProducts.length}</li>
              <li>Cart items to exclude: ${cartIds.length}</li>
              <li>Available for upsell: ${available.length}</li>
              <li>Selected (random 5): ${selected.length}</li>
            </ol>
          </div>
        `;

        if (selected.length === 0) {
          html += `
            <div class="bg-yellow-50 border border-yellow-200 rounded p-4">
              <p class="text-yellow-800 font-semibold">⚠️ No products available for upsell!</p>
              <p class="text-yellow-700 text-sm mt-2">Possible reasons:</p>
              <ul class="list-disc ml-5 text-yellow-700 text-sm">
                <li>All eligible products are already in cart</li>
                <li>Not enough products in database</li>
                <li>isActive or stock values incorrect</li>
              </ul>
            </div>
          `;
        } else {
          html += '<div class="space-y-2">';
          selected.forEach((p, i) => {
            const discountedPrice = Math.round(p.price * 0.92);
            const savings = p.price - discountedPrice;
            html += `
              <div class="border border-gray-200 rounded p-3 bg-gradient-to-br from-orange-50 to-amber-50">
                <div class="flex justify-between items-start">
                  <div>
                    <p class="font-semibold text-gray-900">${i + 1}. ${p.name}</p>
                    <p class="text-xs text-gray-500 mt-1">ID: ${p.id} | Stock: ${p.stock}</p>
                  </div>
                  <div class="text-right">
                    <p class="text-xs line-through text-gray-400">${p.price} грн</p>
                    <p class="text-sm font-bold text-orange-600">${discountedPrice} грн</p>
                    <p class="text-xs text-green-600">↓ ${savings} грн (-8%)</p>
                  </div>
                </div>
              </div>
            `;
          });
          html += '</div>';
        }

        resultEl.innerHTML = html;

      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
        document.getElementById('upsell-result').innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded p-4">
            <p class="text-red-800 font-semibold">Error: ${error.message}</p>
          </div>
        `;
      }
    };

    // Auto-check on load
    log('🚀 Page loaded - ready to test');
  </script>
</body>
</html>
