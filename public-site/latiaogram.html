<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LatiaoGRAM</title>
  <meta name="description" content="Соціальна мережа для фото та Latiao">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', sans-serif;
    }
    
    :root {
      --background: #f8f7fc;
      --foreground: #1a1a2e;
      --card: #ffffff;
      --card-foreground: #1a1a2e;
      --primary: #e11d48;
      --primary-foreground: #ffffff;
      --muted: #f1f0f7;
      --muted-foreground: #6b7280;
      --border: #e5e4ed;
      --input: #f4f3fa;
      --accent: #f97316;
    }
    
    body {
      background: var(--background);
      color: var(--foreground);
    }
    
    .gradient-text {
      background: linear-gradient(to right, #f43f5e, #ec4899, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .gradient-btn {
      background: linear-gradient(to right, #f43f5e, #ec4899, #f97316);
    }
    
    .animate-in {
      animation: fadeSlideIn 0.5s ease-out forwards;
    }
    
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    .modal-animate {
      animation: zoomIn 0.4s ease-out forwards;
    }
    
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    
    .heart-beat {
      animation: heartBeat 0.3s ease-in-out;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    .backdrop-blur {
      backdrop-filter: blur(8px);
    }
    
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

                    <li class="text-gray-500 flex items-start gap-2"><span class="text-green-500 mt-1">•</span>Фото латяо, знайдені в інтернеті</li>
                    <li class="text-gray-500 flex items-start gap-2"><span class="text-green-500 mt-1">•</span>Власні фото, пов'язані з вашим досвідом</li>
                  </ul>
                  <p class="text-sm text-gray-500 mt-3 ml-11 italic">Головне — дотримуватися поваги до інших користувачів.</p>
                </section>

                <section class="animate-in" style="animation-delay: 300ms">
                  <div class="flex items-center gap-2 mb-3">
                    <div class="p-2 rounded-lg bg-red-100">

    let selectedImage = null;
    let selectedFile = null;

    // Firebase Functions
    
    // Initialize Firebase listeners
    function initializeFirebase() {
      // Listen for real-time updates from Firestore
      const postsQuery = query(
        collection(db, 'latiaogram_feed'),
        orderBy('createdAt', 'desc')
      );
      
      onSnapshot(postsQuery, (snapshot) => {
        posts = snapshot.docs;
        render();
      }, (error) => {
        console.error('Error listening to posts:', error);
        
        // Check if this is a CORS-related issue
        if (error.message && error.message.includes('CORS')) {
          showToast('Проблема з доступом. Перейдіть на https://my-magazin-81c96.web.app/latiaogram.html', 'error');
        } else {
          showToast('Помилка завантаження постів', 'error');
        }
      });
    }

    // Generate unique user identifier
    function getUserId() {
      let userId = localStorage.getItem('latiaogram_user_id');
      if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('latiaogram_user_id', userId);
      }
      return userId;
    }

    // Handle like functionality with Firestore
    async function handleLike(postId) {
      try {
        const userId = getUserId();
        const btn = document.getElementById(`like-btn-${postId}`);
        const postRef = doc(db, 'latiaogram_feed', postId);
        
        // Get current post data
        const postSnap = await getDoc(postRef);
        if (!postSnap.exists()) return;
        
        const postData = postSnap.data();
        const likedBy = postData.likedBy || [];
        const userHasLiked = likedBy.includes(userId);
        
        if (btn) {
          btn.querySelector('span').classList.add('heart-beat');
          setTimeout(() => {
            btn.querySelector('span').classList.remove('heart-beat');
          }, 300);
        }
        
        if (userHasLiked) {
          // Remove like
          await updateDoc(postRef, {
            likes: increment(-1),
            likedBy: arrayRemove(userId)
          });
        } else {
          // Add like
          await updateDoc(postRef, {
            likes: increment(1),
            likedBy: arrayUnion(userId)
          });
        }
        
      } catch (error) {
        console.error('Error updating like:', error);
        showToast('Помилка при лайку', 'error');
      }
    }

    function openModal() {
      isModalOpen = true;
      selectedImage = null;
      selectedFile = null;
      render();
    }

    function closeModal() {
      isModalOpen = false;
      selectedImage = null;
      selectedFile = null;
      render();
    }

    function openRules() {
      isRulesOpen = true;
      document.body.style.overflow = 'hidden';
      render();
    }

    function closeRules() {
      isRulesOpen = false;
      document.body.style.overflow = 'unset';
      render();
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file && file.type.startsWith('image/')) {
        // Check file size (5MB limit)
        const maxSize = 5 * 1024 * 1024;
        if (file.size > maxSize) {
          showToast('Розмір файлу має бути менше 5MB. Спробуйте стиснути зображення.', 'error');
          return;
        }
        
        selectedFile = file;
        const reader = new FileReader();
        reader.onloadend = function() {
          selectedImage = reader.result;
          const container = document.getElementById('imagePreviewContainer');
          const sizeText = `${(file.size / 1024).toFixed(1)}KB`;
          container.innerHTML = `
            <img src="${selectedImage}" alt="Попередній перегляд" class="w-full h-full object-cover" />
            <div class="absolute bottom-2 right-2 bg-black/70 text-white text-xs px-2 py-1 rounded">
              ${sizeText}
            </div>
          `;
          checkFormValidity();
        };
        reader.readAsDataURL(file);
      }
    }

    function checkFormValidity() {
      const nickname = document.getElementById('nickname')?.value;
      const description = document.getElementById('description')?.value;
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.disabled = !(nickname && description && selectedFile) || isUploading;
      }
    }

    async function submitPost(event) {
      event.preventDefault();
      
      if (isUploading) return;
      
      const nickname = document.getElementById('nickname').value.trim();
      const description = document.getElementById('description').value.trim();
      
      if (!nickname || !selectedFile) {
        showToast('Будь ласка, заповніть всі поля', 'error');
        return;
      }
      
      isUploading = true;
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.textContent;
      
      try {
        // Update button to show loading
        submitBtn.innerHTML = `
          <div class="flex items-center justify-center gap-2">
            <div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
            <span>Завантаження...</span>
          </div>
        `;
        submitBtn.disabled = true;
        
        // Check file size (limit to 5MB for direct base64 storage)
        const maxSize = 5 * 1024 * 1024; // 5MB
        if (selectedFile.size > maxSize) {
          showToast('Розмір файлу має бути менше 5MB', 'error');
          return;
        }
        
        showToast('Обробляємо зображення...', 'success');
        
        // Convert image to base64 and compress if needed
        const processedImage = await processImageForDirectStorage(selectedFile);
        
        // Check final size
        const finalSize = processedImage.length * 0.75; // Approximate byte size
        if (finalSize > 1024 * 1024) {
          showToast('Зображення занадто велике навіть після стиснення. Спробуйте менше фото.', 'error');
          return;
        }
        
        showToast('Зберігаємо пост...', 'success');
        
        // Save post directly to Firestore with base64 image
        await addDoc(collection(db, 'latiaogram_feed'), {
          nickname: nickname,
          caption: description || '', // Ensure caption is always a string
          imageUrl: processedImage, // Store base64 directly
          likes: 0,
          likedBy: [], // Array to track who liked the post
          createdAt: serverTimestamp()
        });
        
        // Success feedback
        showToast('Пост успішно опубліковано!', 'success');
        closeModal();
        
      } catch (error) {
        console.error('Error uploading post:', error);
        console.error('Error code:', error.code);
        console.error('Error message:', error.message);
        
        if (error.message.includes('size')) {
          showToast('Зображення занадто велике. Спробуйте менше фото.', 'error');
        } else if (error.code === 'permission-denied') {
          showToast('Помилка дозволів. Перевірте підключення і спробуйте ще раз.', 'error');
        } else {
          showToast('Помилка завантаження. Спробуйте ще раз.', 'error');
        }
      } finally {
        isUploading = false;
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    }

    // Process image for direct storage (compress and convert to base64)
    async function processImageForDirectStorage(file) {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        img.onload = function() {
          // Start with aggressive compression for large files
          let maxSize = file.size > 2 * 1024 * 1024 ? 600 : 800; // Smaller dimensions for large files
          let quality = file.size > 2 * 1024 * 1024 ? 0.5 : 0.7; // Lower quality for large files
          
          function compressImage(targetSize, targetQuality) {
            // Calculate new dimensions
            let { width, height } = img;
            
            if (width > height) {
              if (width > targetSize) {
                height *= targetSize / width;
                width = targetSize;
              }
            } else {
              if (height > targetSize) {
                width *= targetSize / height;
                height = targetSize;
              }
            }
            
            // Set canvas size
            canvas.width = width;
            canvas.height = height;
            
            // Draw and compress image
            ctx.drawImage(img, 0, 0, width, height);
            
            // Convert to base64 with compression
            const compressedDataUrl = canvas.toDataURL('image/jpeg', targetQuality);
            
            // Check if result is under Firestore 1MB limit (with some buffer)
            const base64Size = compressedDataUrl.length * 0.75; // Approximate size in bytes
            const maxFirestoreSize = 800 * 1024; // 800KB buffer for other fields
            
            if (base64Size > maxFirestoreSize && (targetSize > 400 || targetQuality > 0.3)) {
              // Need more compression
              if (targetQuality > 0.3) {
                return compressImage(targetSize, targetQuality - 0.1);
              } else {
                return compressImage(Math.max(400, targetSize - 100), 0.3);
              }
            }
            
            return compressedDataUrl;
          }
          
          try {
            const result = compressImage(maxSize, quality);
            resolve(result);
          } catch (err) {
            reject(err);
          }
        };
        
        img.onerror = () => {
          reject(new Error('Failed to process image'));
        };
        
        // Load image
        const reader = new FileReader();
        reader.onload = (e) => {
          img.src = e.target.result;
        };
        reader.onerror = () => {
          reject(new Error('Failed to read file'));
        };
        reader.readAsDataURL(file);
      });
    }

    // Toast notification system
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
      
      toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300`;
      toast.textContent = message;
      
      document.body.appendChild(toast);
      
      // Auto remove after 3 seconds
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -100%)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Check domain and show info if on custom domain
    function checkDomainCompatibility() {
      // Domain compatibility message removed per user request
    }

    // Listen for input changes
    document.addEventListener('input', function(e) {
      if (e.target.id === 'nickname' || e.target.id === 'description') {
        checkFormValidity();
      }
    });

    // Initialize Firebase and render
    checkDomainCompatibility();
    initializeFirebase();
    render();
    
    // Make functions globally available
    window.handleLike = handleLike;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.openRules = openRules;
    window.closeRules = closeRules;
    window.previewImage = previewImage;
    window.submitPost = submitPost;
  </script>
