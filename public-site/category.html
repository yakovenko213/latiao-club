  <!-- 🎯 SEO: Dynamic Canonical Tag for Category Pages -->
  <script>
    (function() {
      'use strict';
      const PRODUCTION_DOMAIN = 'latiao-snack.com.ua';
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');
      
      // Build canonical URL with slug parameter
      const canonicalUrl = slug 
        ? `https://${PRODUCTION_DOMAIN}/category.html?slug=${encodeURIComponent(slug)}`
        : `https://${PRODUCTION_DOMAIN}/category.html`;
      
      // Create and inject canonical link
      const link = document.createElement('link');
      link.rel = 'canonical';
      link.href = canonicalUrl;
      document.head.appendChild(link);
      
      // Debug log (development mode only)
      if (window.__consoleMode === 'development') {
        console.log('[Canonical Tag] Category:', canonicalUrl);
      }
    })();
  </script>

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      font-family: 'Inter', sans-serif;
    }

    .hero-blob {
      position: absolute;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.1) 0%, rgba(255, 107, 0, 0.05) 100%);

    .chili-decoration {

    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    .btn-press:active {
      transform: scale(0.95);
    }

    .out-of-stock {
      filter: saturate(0.5);
    }

    .qty-controls {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .card-hover:hover .qty-controls {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .qty-controls {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading-spinner {
      border: 4px solid #f3f4f6;
      border-top: 4px solid #ff6b00;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Toast animations */
    .toast-enter {
      animation: slideIn 0.3s ease-out;
    }

    .toast-exit {
      animation: slideOut 0.3s ease-in;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }

      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }

    /* Cart animations */
    .cart-item-enter {
      animation: fadeSlideIn 0.3s ease-out;
    }

    .cart-item-exit {
      animation: fadeSlideOut 0.28s ease-in;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeSlideOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(100%);
      }
    }

    /* Progress bar animation */
    .progress-bar-fill {
      transition: width 0.5s ease-out;
    }

    /* Product card animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-card {
      animation: fadeSlideUp 0.6s ease-out forwards;
    }

    /* Filter Drawer Styles */
    .filter-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .filter-drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .filter-drawer {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      max-width: 400px;
      background: white;
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
    }

    .filter-drawer.active {
      transform: translateX(0);
    }

    /* Mobile: Bottom sheet style */
    @media (max-width: 768px) {
      .filter-drawer {
        top: auto;
        right: 0;
        left: 0;
        max-width: 100%;
        max-height: 85vh;
        border-radius: 24px 24px 0 0;
        transform: translateY(100%);
      }

      .filter-drawer.active {
        transform: translateY(0);
      }
    }
  </style>

  <!-- Логіка сторінки категорії -->
  <script type="module">
    // CRITICAL: Check maintenance mode FIRST
    import './js/maintenance-check.js'

    // Import Firebase - use same pattern as storefront.js for consistency
    import { db } from './js/firebase-init.js'
    import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js'

    // Import View Tracker for analytics
    import './js/view-tracker.js'

    // 🎯 AI-Powered Personalized Recommendations (category tracking)
    import { trackProductView } from './js/personalized-recommendations.js'

    // ============================================
    // GLOBAL UI HELPERS
    // ============================================

    // Toggle Filter Drawer
    window.toggleFilterDrawer = function () {
      const drawer = document.getElementById('filter-drawer')
      const overlay = document.getElementById('filter-overlay')

      if (drawer && overlay) {
        drawer.classList.toggle('active')
        overlay.classList.toggle('active')

        // Prevent body scroll when drawer is open
        if (drawer.classList.contains('active')) {
          document.body.style.overflow = 'hidden'
        } else {
          document.body.style.overflow = ''
        }
      }
    }

    // Apply filters and close drawer
    window.applyFiltersAndClose = function () {
      window.applyFilters()
      window.toggleFilterDrawer()
    }

    // ============================================
    // MAIN PAGE LOGIC
    // ============================================

    // Global state for products and filters
    let allProducts = []
    let filteredProducts = []
    let currentAbortController = null // For canceling ongoing requests

    // Skeleton screen helper
    function showSkeleton(count = 8) {
      const grid = document.getElementById('products-grid')
      grid.innerHTML = Array(count).fill(0).map(() => `
        <div class="bg-white rounded-3xl shadow-lg overflow-hidden animate-pulse">
          <div class="aspect-square bg-gray-200"></div>
          <div class="p-5 space-y-3">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-6 bg-gray-200 rounded w-1/2"></div>
            <div class="h-10 bg-gray-200 rounded"></div>
          </div>
        </div>
      `).join('')
    }

    async function initPage() {
      const urlParams = new URLSearchParams(window.location.search)
      const categorySlug = urlParams.get('slug')

      if (!categorySlug) {
        document.getElementById('loading-state').style.display = 'none'
        document.getElementById('products-grid').innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">❌ Категорію не вказано в URL</div>'
        return
      }

      // ⚡ FIX: Declare usedCache OUTSIDE try block to avoid "Can't find variable" error
      let usedCache = false;
      
      // ⚡ FIX: Set loading state immediately
      document.getElementById('loading-state').style.display = 'flex';

      // 🎯 Track category view for personalization (time spent tracking)
      try {
        trackProductView(null, categorySlug, null);
      } catch (e) {
        console.log('ℹ️ Category tracking skipped');
      }

      // Cancel any ongoing requests from previous category
      if (currentAbortController) {
        currentAbortController.abort()
      }
      currentAbortController = new AbortController()
      const signal = currentAbortController.signal

      try {
        // ⚡ STEP 1: Check IndexedDB cache for INSTANT rendering
        // ⚡ FIX: Defensive check for productCache existence (race condition protection)
        let cached = null;
        if (window.productCache && typeof window.productCache.getCached === 'function') {
          try {
            cached = await window.productCache.getCached(categorySlug);
          } catch (cacheError) {
            console.warn('⚠️ Cache read failed:', cacheError.message);
            // Try localStorage fallback
            try {
              const localData = localStorage.getItem(`category_cache_${categorySlug}`);
              if (localData) {
                cached = JSON.parse(localData);
                console.log('✅ Using localStorage fallback');
              }
            } catch (lsError) {
              console.warn('⚠️ LocalStorage fallback failed:', lsError.message);
            }
          }
        } else {
          console.warn('⚠️ productCache not initialized yet, skipping cache check');
        }

        if (cached && cached.products) {

          // INSTANTLY show cached data
          if (cached.categoryData) {
            document.title = `${cached.categoryData.name} | Latiao`
            document.getElementById('category-title').textContent = cached.categoryData.name
            document.getElementById('category-desc').textContent = cached.categoryData.description || 'Найкращі снеки в цій категорії'
            document.getElementById('breadcrumb-current').textContent = cached.categoryData.name
          }

          allProducts = cached.products
          filteredProducts = [...allProducts]
          renderProducts(filteredProducts)
          setupFilterListeners()
          document.getElementById('loading-state').style.display = 'none'
          usedCache = true
        } else {
          // No cache - show skeleton
          showSkeleton()
        }

        // ⚡ STEP 2: Fetch fresh data with timeout protection
        const fetchPromise = Promise.all([
          getDocs(query(collection(db, 'categories'), where('slug', '==', categorySlug))),
          getDocs(query(collection(db, 'products'), where('categories', 'array-contains', categorySlug))),
          getDocs(query(collection(db, 'products'), where('category', '==', categorySlug)))
        ])

        // ⚡ FIX: Increase timeout to 10 seconds for slow 3G/EDGE connections
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error('Timeout: З\'єднання занадто повільне')), 10000)
        )

        let catSnap, newFormatSnap, oldFormatSnap
        
        try {
          [catSnap, newFormatSnap, oldFormatSnap] = await Promise.race([fetchPromise, timeoutPromise])
        } catch (timeoutError) {
          if (usedCache) {
            // Keep showing cached data on timeout
            console.warn('⏱️ Fetch timed out - keeping cached data')
            return
          }
          throw timeoutError
        }

        // Check if request was aborted
        if (signal.aborted) {
          console.log('🛑 Request aborted (user switched category)')
          return
        }

        // Process category metadata
        let categoryData = null
        if (!catSnap.empty) {
          categoryData = catSnap.docs[0].data()
          console.log('✅ Категорія знайдена:', categoryData)

          document.title = `${categoryData.name} | Latiao`
          document.getElementById('category-title').textContent = categoryData.name
          document.getElementById('category-desc').textContent = categoryData.description || 'Найкращі снеки в цій категорії'
          document.getElementById('breadcrumb-current').textContent = categoryData.name
          
          // 🔥 Track view count for this category
          if (window.incrementViewCount) {
            window.incrementViewCount('categories', categorySlug)
          }
        } else {
          console.warn('⚠️ Категорію не знайдено в базі')
          document.getElementById('category-title').textContent = "Категорію не знайдено"
          document.getElementById('category-desc').textContent = "Спробуйте іншу категорію"
        }

        // ⚡ Combine server-filtered results (Firestore filtered by category)
        const newProducts = newFormatSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
        const oldProducts = oldFormatSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }))

        // Merge and deduplicate
        const productMap = new Map()
        newProducts.concat(oldProducts).forEach(p => productMap.set(p.id, p))
        allProducts = Array.from(productMap.values())

        // Filter hidden products (client-side to avoid needing composite index)
        allProducts = allProducts.filter(p => p.isVisible !== false)

        // Sort by sortOrder
        allProducts.sort((a, b) => (a.sortOrder ?? 9999) - (b.sortOrder ?? 9999))

        console.log(`📦 Знайдено товарів: ${allProducts.length}`)

        // ⚡ STEP 3: Save to IndexedDB cache (async, non-blocking) + localStorage backup
        if (window.productCache && typeof window.productCache.setCached === 'function') {
          window.productCache.setCached(categorySlug, categoryData, allProducts).catch(err => {
            console.warn('⚠️ Failed to cache to IndexedDB:', err);
            // Fallback to localStorage
            try {
              const cacheData = { categoryData, products: allProducts, timestamp: Date.now() };
              localStorage.setItem(`category_cache_${categorySlug}`, JSON.stringify(cacheData));
              console.log('✅ Saved to localStorage fallback');
            } catch (lsError) {
              console.warn('⚠️ LocalStorage fallback also failed:', lsError.message);
            }
          });
        } else {
          // If productCache not available, use localStorage directly
          try {
            const cacheData = { categoryData, products: allProducts, timestamp: Date.now() };
            localStorage.setItem(`category_cache_${categorySlug}`, JSON.stringify(cacheData));
            console.log('✅ Saved to localStorage (productCache unavailable)');
          } catch (lsError) {
            console.warn('⚠️ LocalStorage save failed:', lsError.message);
          }
        }

        // If we didn't use cache, show products now
        if (!usedCache) {
          filteredProducts = [...allProducts]
          renderProducts(filteredProducts)
          setupFilterListeners()
        } else {
          // Update with fresh data (in case something changed)
          filteredProducts = [...allProducts]
          renderProducts(filteredProducts)
          console.log('✅ Дані оновлено')
        }

      } catch (err) {
        console.error('❌ Помилка завантаження:', err);
        
        // ⚡ FIX: Improved error handling with usedCache properly scoped
        // If we have cached data, keep showing it instead of error
        if (usedCache) {
          console.log('✅ Showing cached data despite error');
          // User already sees cached data, just log the error
          return;
        }
        
        // No cached data available - show friendly error with retry button
        document.getElementById('products-grid').innerHTML = `
          <div class="col-span-full text-center py-16 px-4">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8">
              <div class="mb-4">
                <svg class="w-16 h-16 mx-auto text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <h3 class="text-xl font-bold text-gray-800 mb-2">Проблеми зі з'єднанням</h3>
              <p class="text-gray-600 mb-4">Не вдалося завантажити дані. Перевірте інтернет-з'єднання.</p>
              <details class="mb-6 text-left">
                <summary class="cursor-pointer text-sm text-gray-500 hover:text-gray-700">Технічні деталі</summary>
                <p class="mt-2 text-xs text-gray-500 bg-gray-50 p-3 rounded">${err.message}</p>
              </details>
              <button 
                onclick="location.reload()" 
                class="w-full px-6 py-3 bg-orange-500 text-white font-semibold rounded-xl hover:bg-orange-600 transition-colors duration-200 shadow-md hover:shadow-lg transform hover:scale-105">
                🔄 Спробувати ще раз
              </button>
              <p class="mt-4 text-xs text-gray-400">Або спробуйте пізніше</p>
            </div>
          </div>
        `;
      } finally {
        document.getElementById('loading-state').style.display = 'none';
      }
    }

    // ============================================
    // FILTER FUNCTIONS
    // ============================================

    function setupFilterListeners() {
      // Apply on Enter key in price inputs
      document.getElementById('filter-price-min')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') window.applyFiltersAndClose()
      })
      document.getElementById('filter-price-max')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') window.applyFiltersAndClose()
      })
    }

    window.applyFilters = function () {
      console.log('🔍 Applying filters...')

      // Get filter values
      const minPrice = parseFloat(document.getElementById('filter-price-min').value) || null
      const maxPrice = parseFloat(document.getElementById('filter-price-max').value) || null

      // Get selected spiciness levels
      const spicinessCheckboxes = document.querySelectorAll('.spiciness-filter:checked')
      const selectedSpiciness = Array.from(spicinessCheckboxes).map(cb => parseInt(cb.value))

      console.log('💰 Price range:', { min: minPrice, max: maxPrice })
      console.log('🌶️ Selected spiciness levels:', selectedSpiciness)

      // Filter products
      filteredProducts = allProducts.filter(product => {
        // Price filter
        if (minPrice !== null && product.price < minPrice) return false
        if (maxPrice !== null && product.price > maxPrice) return false

        // Spiciness filter (multi-select)
        // If no checkboxes selected, show all spiciness levels
        if (selectedSpiciness.length > 0) {
          const productSpiciness = parseInt(product.spiciness) || 0
          if (!selectedSpiciness.includes(productSpiciness)) return false
        }

        return true
      })

      console.log(`✅ Filtered products: ${filteredProducts.length} of ${allProducts.length}`)
      renderProducts(filteredProducts)
    }

    window.resetFilters = function () {
      console.log('🔄 Resetting filters...')

      // Clear price inputs
      document.getElementById('filter-price-min').value = ''
      document.getElementById('filter-price-max').value = ''

      // Uncheck all spiciness checkboxes
      document.querySelectorAll('.spiciness-filter').forEach(cb => cb.checked = false)

      // Show all products
      filteredProducts = [...allProducts]
      renderProducts(filteredProducts)
    }

    // ============================================
    // DATE FORMATTING UTILITIES
    // ============================================

    function formatUkrainianDate(dateString) {
      if (!dateString) return ''

      const date = new Date(dateString)
      const months = [
        'січня', 'лютого', 'березня', 'квітня', 'травня', 'червня',
        'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'
      ]

      const day = date.getDate()
      const month = months[date.getMonth()]

      return `${day} ${month}`
    }

    function isDateInFuture(dateString) {
      if (!dateString) return false
      const arrivalDate = new Date(dateString)
      const today = new Date()
      today.setHours(0, 0, 0, 0)
      return arrivalDate >= today
    }

    function renderProducts(products) {
      const grid = document.getElementById('products-grid')
      document.getElementById('products-count').textContent = products.length

      if (products.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10">
            <div class="text-6xl mb-4">📭</div>
            <h3 class="text-xl font-bold text-gray-700 mb-2">Товарів поки немає</h3>
            <p class="text-gray-500">Слідкуйте за оновленнями!</p>
          </div>
        `
        return
      }

      // Helper function to render spiciness (5 chilies with proper opacity)
      const renderSpiciness = (level) => {
        const maxChilies = 5
        const spicyLevel = Math.min(level || 1, maxChilies)
        let html = ''
        for (let i = 1; i <= maxChilies; i++) {
          html += `<span class="${i <= spicyLevel ? '' : 'opacity-30'}">🌶️</span>`
        }
        return html
      }

      try {
        grid.innerHTML = products.map((product, index) => {
          try {
            // Stock logic: check stock or quantity field
            const stockAmount = product.stock ?? product.quantity ?? 0
            const inStock = stockAmount > 0

            // Handle both new 'images' array and legacy 'image' field
            const images = product.images && product.images.length > 0 ? product.images : []
            const img = images[0] || product.image || product.imageUrl || 'https://placehold.co/400x400/fff3e8/ff6b00?text=Latiao'

            // Generate spiciness HTML
            const spicinessHTML = renderSpiciness(product.spiciness)

            return `
              <article class="product-card opacity-0 bg-white rounded-3xl shadow-lg overflow-hidden transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl group flex flex-col h-full" style="animation-delay: ${index * 0.1}s">
                <!-- Clickable Image & Title Area -->
                <a href="product.html?id=${product.id}" class="block">
                  <div class="relative overflow-hidden aspect-square bg-gray-100">
                    <img 
                      src="${img}" 
                      loading="lazy"
                      decoding="async"
                      class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 ${!inStock ? 'grayscale opacity-50' : ''}" 
                      alt="${product.name}"
                      onerror="this.src='https://placehold.co/400x400/fff3e8/ff6b00?text=Latiao'"
                    >
                    
                    <span class="absolute top-2 left-2 md:top-3 md:left-3 text-white text-[10px] md:text-xs font-semibold px-2 md:px-3 py-0.5 md:py-1 rounded-full shadow-md ${inStock ? 'bg-green-500' : 'bg-red-500'}">
                      ${inStock ? 'В наявності' : 'Немає в наявності'}
                    </span>
                  </div>
                </a>

                <div class="p-3 md:p-5 flex flex-col flex-1">
                  <div class="flex-1">
                    <a href="product.html?id=${product.id}" class="block hover:text-orange-600 transition-colors">
                      <h3 class="text-sm md:text-lg font-bold text-gray-900 mb-1 md:mb-2 line-clamp-2">${product.name}</h3>
                    </a>
                    ${(product.originalPrice && product.originalPrice > product.price)
                ? `<div class="flex items-center gap-2 mb-2 md:mb-3">
                           <span class="text-red-500 line-through text-sm md:text-base">₴ ${product.originalPrice}</span>
                           <span class="text-xl md:text-2xl font-extrabold text-green-600">₴ ${product.price}</span>
                           <span class="bg-red-100 text-red-600 text-[10px] md:text-xs font-bold px-1.5 py-0.5 rounded-full">-${Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100)}%</span>
                         </div>`
                : `<p class="text-xl md:text-2xl font-extrabold text-[#ff6b00] mb-2 md:mb-3">₴ ${product.price} <span class="text-xs md:text-sm font-normal text-gray-500">грн</span></p>`
              }
                    
                    <div class="flex items-center gap-0.5 md:gap-1 mb-2 md:mb-3 text-sm md:text-lg">
                      ${spicinessHTML}
                    </div>
                    
                    <!-- Stock Status -->
                    <div class="mb-3 flex items-center gap-1 text-xs md:text-sm font-semibold ${inStock ? 'text-green-600' : 'text-red-500'}">
                      ${inStock ? '✅ Готово до відправки' : '⛔ Немає в наявності'}
                    </div>

                    <!-- Arrival Date Message (Conditional) -->
                    ${(stockAmount === 0 && product.is_expected && product.arrival_date && isDateInFuture(product.arrival_date))
                ? `<div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-lg px-2.5 md:px-3 py-2 mb-3 shadow-sm hover:shadow-md transition-shadow duration-200">
                           <p class="text-[10px] md:text-sm font-medium text-gray-700 flex items-center gap-1 md:gap-1.5">
                             <span class="text-sm md:text-base flex-shrink-0">✈️</span>
                             <span class="flex-1">
                               <span class="hidden md:inline">Очікуємо поставку</span>
                               <span class="md:hidden">Поставка</span>
                               <span class="text-[#ff6b00] font-semibold ml-1">${formatUkrainianDate(product.arrival_date)}</span>
                             </span>
                           </p>
                         </div>`
                : ''
              }
                  </div>

                  <button 
                    class="add-to-cart-btn w-full font-bold text-xs md:text-base py-2 md:py-3 px-3 md:px-4 rounded-xl md:rounded-2xl transition-all duration-200 hover:shadow-lg active:scale-95 ${inStock ? 'bg-gradient-to-r from-[#ff6b00] to-[#e53e3e] text-white hover:shadow-orange-300/50' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}"
                    data-id="${product.id}"
                    data-name="${product.name.replace(/"/g, '&quot;')}"
                    data-price="${product.price}"
                    data-image="${img}"
                    data-stock="${stockAmount}"
                    data-spiciness="${product.spiciness || 1}"
                    data-sku="${product.sku || product.id}"
                    ${!inStock ? 'disabled' : ''}
                  >
                    ${inStock ? 'Додати в кошик' : 'Немає в наявності'}
                  </button>
                </div>
              </article>
            `
          } catch (productError) {
            console.error('❌ Error rendering product:', product.id, productError)
            // Return empty string to skip this product but continue rendering others
            return ''
          }
        }).join('')

        // Re-init Lucide icons for new product cards
        setTimeout(() => {
          if (typeof lucide !== 'undefined') {
            lucide.createIcons()
          }
        }, 100)

      } catch (error) {
        console.error('❌ Critical error rendering products:', error)
        grid.innerHTML = `
          <div class="col-span-full text-center py-10">
            <div class="text-6xl mb-4">⚠️</div>
            <h3 class="text-xl font-bold text-red-600 mb-2">Помилка завантаження</h3>
            <p class="text-gray-500">Спробуйте оновити сторінку</p>
          </div>
        `
      }
    }

    // ============================================
    // AUTO-START
    // ============================================

    // Instant Firebase check - no delays if already ready
    async function startPage() {
      try {
        // ⚡ Check if Firebase is ALREADY ready (synchronous check)
        if (db && typeof db === 'object') {
          // Firebase is ready! Start immediately with ZERO delay
          await initPage()
          return
        }

        // Fallback: If Firebase not ready yet (rare), wait for it
        console.log('[Firebase] Waiting for Firebase initialization...')
        for (let i = 0; i < 20; i++) {
          if (db && typeof db === 'object') {
            console.log('✅ Firebase ready after', i, 'retries')
            await initPage()
            return
          }
          await new Promise(resolve => setTimeout(resolve, 50))
        }

        throw new Error('Firebase initialization timeout')
      } catch (err) {
        console.error('[v0] startPage error:', err)
        document.getElementById('loading-state').style.display = 'none'
        document.getElementById('products-grid').innerHTML = `
          <div class="col-span-full text-center py-10">
            <div class="text-6xl mb-4">&#128293;</div>
            <h3 class="text-xl font-bold text-red-600 mb-2">Помилка завантаження</h3>
            <p class="text-gray-500">${err.message}</p>
            <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600">
              Оновити сторінку
            </button>
          </div>
        `
      }
    }

    // ============================================
    // GLOBAL EVENT DELEGATION FOR ADD TO CART BUTTONS
    // ============================================
    // This handles clicks on dynamically rendered buttons
    document.addEventListener('click', (e) => {
      // Check if clicked element or its parent is an add-to-cart button
      const btn = e.target.closest('.add-to-cart-btn');

      if (btn && !btn.disabled) {
        e.preventDefault();

        // Extract product data from data attributes
        const product = {
          id: btn.dataset.id,
          name: btn.dataset.name,
          price: parseFloat(btn.dataset.price),
          image: btn.dataset.image,
          stock: parseInt(btn.dataset.stock) || 0,
          spiciness: parseInt(btn.dataset.spiciness) || 1,
          sku: btn.dataset.sku
        };

        // Call the global addToCart function from layout.js
        if (window.addToCart) {
          window.addToCart(product, 'category');
          console.log('✅ Item added via delegated click:', product.name);
        } else {
          console.error('❌ window.addToCart function not found!');
        }
      }
    });

    // Start when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startPage)
    } else {
      startPage()
    }
  </script>

  <!-- Service Worker Registration -->
  <script src="./js/sw-register.js"></script>

  <!-- Live Chat Widget -->
  <script type="module" src="./js/chat-widget.js"></script>
