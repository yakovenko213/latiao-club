  <!-- Quick Add Upsell Logic -->
  <script type="module">
    import { db } from './js/firebase-init.js';
    import { collection, query, where, getDocs, doc, setDoc, getDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    // Import global cashback config listener
    import { onCashbackStateChange } from './js/firebase-config.js';
    
    // ── Upsell Configuration ──────────────────────────────────
    let currentUpsellProduct = null;
    
    // Random headings
    const UPSELL_HEADINGS = [
      'Вигідна пропозиція',
      'Смачне доповнення',
      'Вам точно сподобається',
      'Рекомендуємо спробувати',
      'Додайте до замовлення'
    ];
    
    // ✅ Task 2: Wait for Firebase to be fully initialized
    async function waitForFirebase(maxAttempts = 100) {
      for (let i = 0; i < maxAttempts; i++) {
        if (db && typeof db === 'object') {
          return true;
        }
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      return false;
    }
    
    // Import upsell display helper
    async function shouldShowUpsells(pageName) {
      try {
        const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
        const settingsDoc = await getDoc(doc(db, 'settings', 'upsellDisplayConfig'));
        
        if (settingsDoc.exists()) {
          const settings = settingsDoc.data();
          const pageMap = {
            'productPage': 'showOnProductPage',
            'cart': 'showOnCart',
            'checkout': 'showOnCheckout',
            'thankYou': 'showOnThankYou'
          };
          const fieldName = pageMap[pageName];
          return settings[fieldName] === true;
        }
        
        return false;
      } catch (error) {
        console.error('❌ [Upsell] Error checking upsell settings:', error);
        return false;
      }
    }

    // Initialize Quick Add Upsell
    async function initCartQuickAddUpsell() {
      try {
        const firebaseReady = await waitForFirebase();
        if (!firebaseReady) {
          hideUpsell();
          return;
        }
        
        const shouldShow = await shouldShowUpsells('cart');
        
        if (!shouldShow) {
          hideUpsell();
          return;
        }

        const cartData = localStorage.getItem('latiao_cart');
        const cart = cartData ? JSON.parse(cartData) : [];
        
        if (cart.length === 0) {
          hideUpsell();
          return;
        }

        const cartProductIds = cart.map(item => item.id);

        const productsQuery = query(
          collection(db, 'products'),
          where('stock', '>', 0),
          where('isActive', '==', true)
        );
        
        const snapshot = await getDocs(productsQuery);
        
        if (snapshot.empty) {
          hideUpsell();
          return;
        }

        const availableProducts = [];
        snapshot.forEach(doc => {
          const product = { id: doc.id, ...doc.data() };
          if (!cartProductIds.includes(product.id)) {
            availableProducts.push(product);
          }
        });
        
        if (availableProducts.length === 0) {
          hideUpsell();
          return;
        }

        const productsByCategory = {};
        availableProducts.forEach(product => {
          const category = product.category || (product.categories && product.categories[0]) || 'other';
          if (!productsByCategory[category]) {
            productsByCategory[category] = [];
          }
          productsByCategory[category].push(product);
        });

        const selectedProducts = [];
        const categories = Object.keys(productsByCategory);
        const targetCount = Math.min(4, availableProducts.length);
        
        const shuffledCategories = categories.sort(() => Math.random() - 0.5);
        
        let categoryIndex = 0;
        while (selectedProducts.length < targetCount && categoryIndex < shuffledCategories.length * 3) {
          const category = shuffledCategories[categoryIndex % shuffledCategories.length];
          const categoryProducts = productsByCategory[category];
          
          if (categoryProducts && categoryProducts.length > 0) {
            const randomIndex = Math.floor(Math.random() * categoryProducts.length);
            const product = categoryProducts[randomIndex];
            
            if (!selectedProducts.find(p => p.id === product.id)) {
              selectedProducts.push(product);
              categoryProducts.splice(randomIndex, 1);
            }
          }
          
          categoryIndex++;
        }

        const discount = 5;
        const productsWithPrices = selectedProducts.map(product => ({
          ...product,
          originalPrice: product.price,
          discountedPrice: Math.round(product.price * (1 - discount / 100))
        }));

        if (productsWithPrices.length > 0) {
          renderSingleUpsell(productsWithPrices[0]);
        } else {
          hideUpsell();
        }

      } catch (error) {
        console.error('❌ [Upsell] Error in initCartQuickAddUpsell:', error);
        hideUpsell();
      }
    }

    // ✅ Render Single Upsell Product
    function renderSingleUpsell(product) {
      const container = document.getElementById('upsell-cart-container');
      
      if (!container) return;
      
      if (!product) {
        hideUpsell();
        return;
      }
      
      currentUpsellProduct = product;
      
      const heading = UPSELL_HEADINGS[Math.floor(Math.random() * UPSELL_HEADINGS.length)];
      
      container.innerHTML = '';
      
      const hasDiscount = product.originalPrice && product.originalPrice !== product.discountedPrice;
      let discountPercent = 0;
      if (hasDiscount) {
        discountPercent = Math.round(((product.originalPrice - product.discountedPrice) / product.originalPrice) * 100);
      }
      
      const spicinessString = product.spiciness && product.spiciness > 0 
        ? '🌶️'.repeat(product.spiciness) 
        : '';
      
      const cartData = localStorage.getItem('latiao_cart');
      const cart = cartData ? JSON.parse(cartData) : [];
      const alreadyInCart = cart.some(item => item.id === product.id);
      
      const htmlContent = `
        <div class="rounded-2xl border border-orange-100 bg-orange-50/50 p-4">
          <p class="text-xs font-semibold text-gray-500 tracking-wide uppercase mb-3">
            ${heading}
          </p>
          <div class="flex items-center gap-4">
            <div class="relative w-20 h-20 flex-shrink-0 overflow-hidden rounded-xl bg-white shadow-sm">
              <img 
                src="${product.image}" 
                alt="${product.name}" 
                class="w-full h-full object-cover"
              />
              ${hasDiscount ? `
              <span 
                class="absolute left-1 top-1 rounded-md bg-red-500 px-1.5 py-0.5 text-white font-bold"
                style="font-size: 10px; line-height: 1.2;"
              >
                -${discountPercent}%
              </span>
              ` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-sm font-bold text-gray-900 truncate">${product.name}</h4>
              ${spicinessString ? `<p class="mt-0.5 text-xs">${spicinessString}</p>` : ''}
              <div class="mt-1 flex items-baseline gap-2">
                <span class="text-base font-extrabold" style="color: #ff6b00;">${product.discountedPrice || product.price} грн</span>
                ${hasDiscount ? `<span class="text-xs text-gray-400 line-through">${product.originalPrice} грн</span>` : ''}
              </div>
            </div>
            <button 
              id="upsell-add-btn"
              onclick="handleUpsellAdd()"
              class="btn-press flex-shrink-0 rounded-xl px-4 py-2.5 text-sm font-bold text-white transition-all duration-200 ${alreadyInCart ? 'upsell-added' : ''}"
              style="background-color: ${alreadyInCart ? '#dcfce7' : '#ff6b00'};"
              ${alreadyInCart ? 'disabled' : ''}
            >
              <span class="flex items-center gap-1">
                ${alreadyInCart ? `

        cart = JSON.parse(saved);

        cart.forEach(item => {

    // Save cart to localStorage
    async function saveCart() {
      localStorage.setItem('latiao_cart', JSON.stringify(cart));
      
      if (currentSharedCartId) {
        try {
          const cartRef = doc(db, 'shared_carts', currentSharedCartId);
          await setDoc(cartRef, {
            items: cart,
            lastUpdatedAt: serverTimestamp(),
            itemCount: cart.length
          }, { merge: true });
        } catch (error) {
          console.error('❌ [Share] Error syncing to Firestore:', error);
        }
      }
    }

    // ============================================
    // 🔗 SHARE CART FUNCTIONALITY
    // ============================================
    
    async function shareCart() {
      try {
        if (cart.length === 0) {
          showToast('Кошик порожній! Додайте товари перед тим, як ділитися.', 'warning');
          return;
        }
        
        const cartId = crypto.randomUUID();
        
        const cartRef = doc(db, 'shared_carts', cartId);
        await setDoc(cartRef, {
          items: cart,
          createdAt: serverTimestamp(),
          lastUpdatedAt: serverTimestamp(),
          itemCount: cart.length
        });
        
        const shareUrl = `${window.location.origin}${window.location.pathname}?cartId=${cartId}`;
        
        await navigator.clipboard.writeText(shareUrl);
        
        showToast('🔗 Посилання скопійовано! Поділіться ним з друзями.', 'success');
        
      } catch (error) {
        console.error('❌ [Share] Error sharing cart:', error);
        showToast('Помилка при створенні посилання. Спробуйте ще раз.', 'error');
      }
    }
    
    // Load shared cart from URL parameter
    async function loadSharedCart() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const cartId = urlParams.get('cartId');
        
        if (!cartId) return false;
        
        const cartRef = doc(db, 'shared_carts', cartId);
        const cartSnap = await getDoc(cartRef);
        
        if (!cartSnap.exists()) {
          showToast('Кошик не знайдено. Можливо, посилання застаріло.', 'warning');
          return false;
        }
        
        const sharedCart = cartSnap.data();
        
        currentSharedCartId = cartId;
        
        const localCart = cart.slice();
        const mergedCart = [...localCart];
        
        sharedCart.items.forEach(sharedItem => {
          const existingIndex = mergedCart.findIndex(item => item.sku === sharedItem.sku);
          if (existingIndex >= 0) {
            mergedCart[existingIndex].quantity += sharedItem.quantity;
            applyWholesalePricing(mergedCart[existingIndex]); // Recalculate pricing
          } else {
            mergedCart.push(sharedItem);
          }
        });
        
        // Apply wholesale pricing to all newly added items
        mergedCart.forEach(item => {
          if (!item.isGift) {
            applyWholesalePricing(item);
          }
        });
        
        cart = mergedCart;
        await saveCart();
        renderCart();
        
        showToast(`✅ Додано ${sharedCart.items.length} товарів з кошика друга!`, 'success');
        
        setupRealtimeCollaboration(cartId);
        
        return true;
      } catch (error) {
        console.error('❌ [Share] Error loading shared cart:', error);
        showToast('Помилка при завантаженні кошика.', 'error');
        return false;
      }
    }
    
    // Setup real-time collaboration for shared cart
    let isUpdatingFromSnapshot = false;
    
    function setupRealtimeCollaboration(cartId) {
      const cartRef = doc(db, 'shared_carts', cartId);
      
      onSnapshot(cartRef, (snapshot) => {
        if (!snapshot.exists()) return;
        
        if (isUpdatingFromSnapshot) return;
        
        const sharedCart = snapshot.data();
        
        isUpdatingFromSnapshot = true;
        cart = sharedCart.items;
        
        // Apply wholesale pricing to all items from real-time update
        cart.forEach(item => {
          if (!item.isGift) {
            applyWholesalePricing(item);
          }
        });
        
        localStorage.setItem('latiao_cart', JSON.stringify(cart));
        renderCart();
        isUpdatingFromSnapshot = false;
        
        showToast('🔄 Кошик оновлено іншим користувачем!', 'info');
      }, (error) => {
        console.error('❌ [Share] Real-time listener error:', error);
      });
    }

    // Calculate totals
    function calculateTotal() {
      return cart.reduce((sum, item) => {
        const qty = item.quantity || 1;
        const unitPrice = getProductPrice(item, qty);
        return sum + (unitPrice * qty);
      }, 0);
    }

    function calculateItemsCount() {
      return cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    // ============================================
    // 📦 WHOLESALE PRICING LOGIC
    // ============================================

    /**
     * Get product price based on quantity and wholesale tiers from Firestore
     * Returns the actual price to charge per unit
     * @param {Object} product - Product object from Firestore (with showWholesale, wholesaleTiers, price fields)
     * @param {number} selectedQty - Quantity being purchased
     * @returns {number} - Price per unit
     */
    function getProductPrice(product, selectedQty) {
      const qty = Number(selectedQty);
      const basePrice = Number(product.price || 0);
      
      console.log('📦 [Price Debug] Current Product Data:', {
        name: product.name,
        basePrice: basePrice,
        showWholesale: product.showWholesale,
        wholesaleTiers: product.wholesaleTiers,
        quantity: qty
      });
      
      // 1. Check if wholesale is enabled and tiers exist
      if (product.showWholesale === true && Array.isArray(product.wholesaleTiers) && product.wholesaleTiers.length > 0) {
        
        // 2. Sort tiers by minQty descending to find the highest threshold met
        const sortedTiers = [...product.wholesaleTiers].sort((a, b) => Number(b.minQty) - Number(a.minQty));
        
        // 3. Find the first tier where current quantity is >= minQty
        const applicableTier = sortedTiers.find(tier => qty >= Number(tier.minQty));
        
        if (applicableTier) {
          const wholesalePrice = Number(applicableTier.price);
          console.log(`✅ Wholesale applied for ${product.name}: ${wholesalePrice} UAH (Qty: ${qty}, Tier: ${applicableTier.minQty}+)`);
          return wholesalePrice;
        }
      }
      
      console.log(`ℹ️ Using base price for ${product.name}: ${basePrice} UAH`);
      return basePrice;
    }

    /**
     * Apply wholesale pricing to a cart item
     * Updates the item.price to the effective wholesale price based on quantity
     * @param {Object} item - Cart item to update
     */
    function applyWholesalePricing(item) {
      // Ensure we have a base price stored
      if (!item.basePrice) {
        item.basePrice = Number(item.price);
      }

      // Calculate effective price using the new function
      const effectivePrice = getProductPrice(item, item.quantity);
      const oldPrice = item.price;
      item.price = effectivePrice;
      
      // Calculate discount and tier info for UI display
      const basePrice = Number(item.basePrice);
      if (effectivePrice < basePrice) {
        item.wholesaleDiscount = (basePrice - effectivePrice) / basePrice;
        // Find which tier was applied
        if (item.wholesaleTiers && Array.isArray(item.wholesaleTiers)) {
          const sortedTiers = [...item.wholesaleTiers].sort((a, b) => Number(b.minQty) - Number(a.minQty));
          const appliedTier = sortedTiers.find(t => item.quantity >= Number(t.minQty));
          item.wholesaleTier = appliedTier ? Number(appliedTier.minQty) : null;
        }
      } else {
        item.wholesaleDiscount = 0;
        item.wholesaleTier = null;
      }

      if (oldPrice !== effectivePrice) {
        console.log(`💰 [Price Update] ${item.name}: ${oldPrice} → ${effectivePrice} UAH (qty: ${item.quantity})`);
      }
    }

    // Add item to cart
    function addItem(productId) {
      const product = DEMO_PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      
      const productIsGift = product.isGift === true;
      const existingItem = cart.find(item => 
        item.id === productId &&
        (item.isGift === true) === productIsGift
      );
      
      if (existingItem) {
        if (existingItem.quantity < product.stock) {
          existingItem.quantity++;
          applyWholesalePricing(existingItem); // Apply wholesale pricing
          showToast(`${product.name} додано до кошика`);
        } else {
          showToast('Досягнуто максимальну кількість', 'warning');
        }
      } else {
        const newItem = { 
          ...product, 
          quantity: 1,
          isGift: productIsGift,
          basePrice: product.price // Store original price
        };
        applyWholesalePricing(newItem); // Apply wholesale pricing
        cart.push(newItem);
        showToast(`${product.name} додано до кошика`);
      }
      
      saveCart();
      renderCart();
    }

    // Remove item from cart (LEGACY)
    function removeItem(productId) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      
      const element = document.querySelector(`[data-id="${productId}"]`);
      if (element) {
        element.classList.remove('cart-item-enter');
        element.classList.add('cart-item-exit');
        
        setTimeout(() => {
          cart = cart.filter(i => i.id !== productId);
          saveCart();
          renderCart();
          showToast(`${item.name} видалено`);
        }, 280);
      }
    }
    
    // Remove item by cart index
    function removeItemByIndex(cartIndex) {
      if (cartIndex < 0 || cartIndex >= cart.length) return;
      
      const item = cart[cartIndex];
      const element = document.querySelector(`[data-cart-index="${cartIndex}"]`);
      
      if (element) {
        element.classList.remove('cart-item-enter');
        element.classList.add('cart-item-exit');
        
        setTimeout(() => {
          cart.splice(cartIndex, 1);
          saveCart();
          renderCart();
          showToast(`${item.name} видалено`);
        }, 280);
      }
    }

    // Update quantity (LEGACY)
    function updateQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      
      if (item.isGift === true) {
        showToast('Кількість подарунків не можна змінити', 'warning');
        return;
      }
      
      const newQty = item.quantity + delta;
      
      if (newQty < 1) {
        removeItem(productId);
        return;
      }
      
      if (newQty > item.stock) {
        showToast('Досягнуто максимальну кількість', 'warning');
        return;
      }
      
      item.quantity = newQty;
      applyWholesalePricing(item); // Apply wholesale pricing
      saveCart();
      renderCart();
    }
    
    // Update quantity by index
    function updateQtyByIndex(cartIndex, delta) {
      if (cartIndex < 0 || cartIndex >= cart.length) return;
      
      const item = cart[cartIndex];
      
      if (item.isGift === true) {
        showToast('Кількість подарунків не можна змінити', 'warning');
        return;
      }
      
      const newQty = item.quantity + delta;
      
      if (newQty < 1) {
        removeItemByIndex(cartIndex);
        return;
      }
      
      if (newQty > item.stock) {
        showToast('Досягнуто максимальну кількість', 'warning');
        return;
      }
      
      item.quantity = newQty;
      applyWholesalePricing(item); // Apply wholesale pricing
      saveCart();
      renderCart();
    }

    // Show toast notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      
      const toast = document.createElement('div');
      toast.className = `toast-enter px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2 ${
        type === 'success' ? 'bg-gray-900 text-white' : 'bg-orange-500 text-white'
      }`;
      
      const icon = type === 'success' ? '✓' : '⚠️';
      toast.innerHTML = `<span>${icon}</span><span class="text-sm font-medium">${message}</span>`;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Close cart
    function closeCart() {
      showToast('Кошик закрито');
    }

    // Go shopping
    function goShopping() {
      showToast('Перехід до каталогу...');
    }

    // Checkout
    function checkout() {
      const total = calculateTotal();
      if (total < 100) {
        showToast('Мінімальна сума — 100 грн', 'warning');
        return;
      }
      showToast('Переходимо до оформлення...');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      const loadedShared = await loadSharedCart();
      
      if (!loadedShared) {
        loadCart();
      }
      
      onCashbackStateChange((isEnabled, cashbackPercent) => {
        toggleCashbackUI(isEnabled);
        updateUI();
      });
      
      // Safety check: force badges visible if cashback enabled and cart not empty
      setTimeout(() => {
        const savedCart = JSON.parse(localStorage.getItem('latiao_cart') || '[]');
        if (savedCart.length > 0 && window.cashbackEnabled !== false) {
          const summaryBadge = document.getElementById('cashback-summary-badge');
          const cartBadge = document.getElementById('cashback-badge-cart');
          if (summaryBadge) summaryBadge.classList.remove('hidden');
          if (cartBadge) cartBadge.classList.remove('hidden');
        }
      }, 100);
    });
  </script>

  <!-- 📊 Visitor Device Tracking - Logs ONCE per session -->
  <script src="./js/visitor-tracker.js"></script>

  <!-- Maintenance Mode Check -->
  <script type="module" src="./js/maintenance-check.js"></script>

  <!-- Live Chat Widget -->
  <script type="module" src="./js/chat-widget.js"></script>
</body>
