  <!-- Quick Add Upsell Logic -->
  <script type="module">
    import { db } from './js/firebase-init.js';
    import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    // Import global cashback config listener
    import { initCashbackListener, onCashbackStateChange } from './js/cashback-config.js';
    
    // ── Upsell Configuration ──────────────────────────────────
    let currentUpsellProduct = null;
    
    // Random headings
    const UPSELL_HEADINGS = [
      'Вигідна пропозиція',
      'Смачне доповнення',
      'Вам точно сподобається',
      'Рекомендуємо спробувати',
      'Додайте до замовлення'
    ];
    
    // ✅ Task 2: Wait for Firebase to be fully initialized
    async function waitForFirebase(maxAttempts = 100) {
      console.error('🔥 [Upsell] Waiting for Firebase initialization...');
      console.error('🔥 [Upsell] db object exists:', typeof db);
      console.error('🔥 [Upsell] db value:', db);
      
      for (let i = 0; i < maxAttempts; i++) {
        if (db && typeof db === 'object') {
          console.error('✅ [Upsell] Firebase DB ready after', i + 1, 'attempts!');
          return true;
        }
        await new Promise(resolve => setTimeout(resolve, 100));
        
        // Log every 10 attempts
        if ((i + 1) % 10 === 0) {
          console.error(`⏳ [Upsell] Still waiting... attempt ${i + 1}/${maxAttempts}`);
        }
      }
      console.error('❌ [Upsell] Firebase DB not initialized after', maxAttempts * 100, 'ms');
      console.error('❌ [Upsell] Final db value:', db);
      return false;
    }
    
    // Import upsell display helper
    async function shouldShowUpsells(pageName) {
      try {
        console.error('🔍 [Upsell] Checking settings/upsellDisplayConfig...');
        const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
        const settingsDoc = await getDoc(doc(db, 'settings', 'upsellDisplayConfig'));
        
        console.error('📄 [Upsell] Settings document exists:', settingsDoc.exists());
        
        if (settingsDoc.exists()) {
          const settings = settingsDoc.data();
          console.error('📋 [Upsell] Admin settings loaded:', settings);
          const pageMap = {
            'productPage': 'showOnProductPage',
            'cart': 'showOnCart',
            'checkout': 'showOnCheckout',
            'thankYou': 'showOnThankYou'
          };
          const fieldName = pageMap[pageName];
          const shouldShow = settings[fieldName] === true;
          console.error(`✅ [Upsell] Field "${fieldName}" value:`, settings[fieldName]);
          console.error(`✅ [Upsell] ${pageName} upsell enabled:`, shouldShow);
          return shouldShow;
        }
        
        console.error('⚠️ [Upsell] Settings document not found, defaulting to false');
        return false;
      } catch (error) {
        console.error('❌ [Upsell] Error checking upsell settings:', error);
        console.error('❌ [Upsell] Error details:', error.message, error.stack);
        return false;
      }
    }

    // Initialize Quick Add Upsell (3-4 products from different categories)
    async function initCartQuickAddUpsell() {
      try {
        console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.error('🚀 [Upsell] STARTING CART UPSELL INITIALIZATION');
        console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        
        // ✅ Task 2: Wait for Firebase to be ready
        const firebaseReady = await waitForFirebase();
        if (!firebaseReady) {
          console.error('❌ [Upsell] Cannot initialize - Firebase not ready');
          const container = document.getElementById('upsell-cart-container');
          if (container) {
            container.classList.add('hidden');
            container.style.display = 'none';
          }
          return;
        }
        
        // ✅ Task 3: Check admin setting from settings/upsellDisplayConfig
        console.error('🔍 [Upsell] Checking admin toggle...');
        const shouldShow = await shouldShowUpsells('cart');
        console.error('🎯 [Upsell] shouldShowUpsells result:', shouldShow);
        
        if (!shouldShow) {
          console.error('🚫 [Upsell] Cart upsells disabled by admin (showOnCart: false)');
          const container = document.getElementById('upsell-cart-container');
          if (container) {
            container.classList.add('hidden');
            container.style.display = 'none';
          }
          return;
        }
        
        console.error('✅ [Upsell] Admin check passed! showOnCart: true');

        // Get current cart items
        const cartData = localStorage.getItem('latiao_cart');
        const cart = cartData ? JSON.parse(cartData) : [];
        console.error('🛒 [Upsell] Cart items:', cart.length);
        
        // ✅ Task 4: If cart is empty, hide upsell section
        if (cart.length === 0) {
          console.log('📭 [Upsell] Cart is empty - hiding upsell section');
          const container = document.getElementById('upsell-cart-container');
          if (container) {
            container.classList.add('hidden');
            container.style.display = 'none'; // ✅ Task 4: Explicit display none
          }
          return;
        }

        const cartProductIds = cart.map(item => item.id);
        console.error('📋 [Upsell] Products in cart:', cartProductIds);

        // ✅ Task 3: Fetch random products from 'products' collection
        console.error('🔍 [Upsell] Fetching random products from categories...');
        console.error('🔍 [Upsell] Query filters: stock > 0, isActive == true');
        
        const productsQuery = query(
          collection(db, 'products'),
          where('stock', '>', 0),
          where('isActive', '==', true)
        );
        
        const snapshot = await getDocs(productsQuery);
        console.error('📦 [Upsell] Total active products found:', snapshot.size);
        
        if (snapshot.empty) {
          console.warn('⚠️ [Upsell] No products available in database');
          const container = document.getElementById('upsell-cart-container');
          if (container) {
            container.classList.add('hidden');
            container.style.display = 'none'; // ✅ Task 4: Hide empty container
          }
          return;
        }

        // Filter: Exclude products already in cart
        const availableProducts = [];
        snapshot.forEach(doc => {
          const product = { id: doc.id, ...doc.data() };
          if (!cartProductIds.includes(product.id)) {
            availableProducts.push(product);
          }
        });

        console.log('✅ [Upsell] Available products after filtering cart:', availableProducts.length);
        console.log('📊 [Upsell] Task 3: Products retrieved:', availableProducts.map(p => ({
          id: p.id,
          name: p.name,
          image: p.image,
          price: p.price,
          stock: p.stock,
          category: p.category || p.categories
        })));
        
        // ✅ Task 4: If no products meet criteria, hide container
        if (availableProducts.length === 0) {
          console.warn('⚠️ [Upsell] All products already in cart or unavailable');
          const container = document.getElementById('upsell-cart-container');
          if (container) {
            container.classList.add('hidden');
            container.style.display = 'none'; // ✅ Task 4: display: none fallback
          }
          return;
        }

        // ✅ Group products by category for diversity
        console.log('🗂️  [Upsell] Grouping products by category...');
        const productsByCategory = {};
        availableProducts.forEach(product => {
          // Get category from 'category' field or first item in 'categories' array
          const category = product.category || (product.categories && product.categories[0]) || 'other';
          if (!productsByCategory[category]) {
            productsByCategory[category] = [];
          }
          productsByCategory[category].push(product);
        });
        
        console.log('📂 [Upsell] Products grouped by categories:', Object.keys(productsByCategory).map(cat => 
          `${cat}: ${productsByCategory[cat].length} products`
        ));

        // ✅ Select 3-4 random products from different categories
        const selectedProducts = [];
        const categories = Object.keys(productsByCategory);
        const targetCount = Math.min(4, availableProducts.length);
        
        console.log(`🎯 [Upsell] Selecting ${targetCount} products from ${categories.length} categories...`);
        
        // Shuffle categories for randomness
        const shuffledCategories = categories.sort(() => Math.random() - 0.5);

      const cartSummary = document.getElementById('cart-summary');
      const deliveryProgress = document.getElementById('delivery-progress');
      
      if (cart.length === 0) {
        if (emptyState) emptyState.classList.remove('hidden');
        if (cartItems) cartItems.classList.add('hidden');
        if (cartSummary) cartSummary.classList.add('hidden');
        if (deliveryProgress) deliveryProgress.classList.add('hidden');
      } else {
        if (emptyState) emptyState.classList.add('hidden');
        if (cartItems) cartItems.classList.remove('hidden');
        if (cartSummary) cartSummary.classList.remove('hidden');
        if (deliveryProgress) deliveryProgress.classList.remove('hidden');
      }
    }

    // Render spiciness
    function renderSpiciness(level) {
      return '🌶️'.repeat(level);
    }

    // Render cart items
    function renderCart() {
      const container = document.getElementById('cart-items');
      
      container.innerHTML = cart.map((item, cartIndex) => {
        const isGift = item.isGift === true;
        
        return `
        <div class="cart-item-enter card-hover bg-white border border-gray-100 rounded-3xl p-4 shadow-sm ${isGift ? 'border-green-200 bg-green-50/30' : ''}" data-cart-index="${cartIndex}">
          ${isGift ? '<div class="absolute top-2 right-2 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-full">🎁 Подарунок</div>' : ''}
          <div class="flex gap-4">
            <!-- Product Image -->
            <div class="w-20 h-20 flex-shrink-0 bg-orange-50 rounded-2xl overflow-hidden ${isGift ? 'ring-2 ring-green-400' : ''}">
              <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
            </div>
            
            <!-- Product Info -->
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <h3 class="font-bold text-gray-900 truncate">${item.name}</h3>
                  ${isGift ? '<p class="text-xs text-green-600 font-semibold mt-0.5">🎁 Подарунок від Latiao Snack</p>' : `<p class="text-xs mt-0.5">${renderSpiciness(item.spiciness)}</p>`}
                </div>
                <button onclick="removeItemByIndex(${cartIndex})" class="btn-press flex-shrink-0 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
              
              <div class="flex items-center justify-between mt-3">
                <!-- Quantity Controls -->
                ${!isGift ? `
                <div class="flex items-center gap-1 bg-gray-100 rounded-xl p-1">
                  <button onclick="updateQtyByIndex(${cartIndex}, -1)" class="qty-btn w-8 h-8 rounded-lg bg-white flex items-center justify-center font-bold text-gray-600 shadow-sm">
                    −
                  </button>
                  <span class="w-8 text-center font-bold text-gray-900">${item.quantity}</span>
                  <button onclick="updateQtyByIndex(${cartIndex}, 1)" ${item.quantity >= item.stock ? 'disabled' : ''} class="qty-btn w-8 h-8 rounded-lg bg-white flex items-center justify-center font-bold text-gray-600 shadow-sm">
                    +
                  </button>
                </div>
                ` : `
                <div class="text-sm text-green-600 font-semibold">Безкоштовно</div>
                `}
                
                <!-- Price -->
                <div class="text-right">
                  <p class="text-lg font-extrabold ${isGift ? 'text-green-600' : 'text-primary'}">${isGift ? '0 грн' : (item.price * item.quantity) + ' грн'}</p>
                  ${item.quantity > 1 && !isGift ? `<p class="text-xs text-gray-400">${item.price} грн/шт</p>` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      }).join('');
      
      updateUI();
    }

    // Add item to cart
    function addItem(productId) {
      const product = DEMO_PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      
      // REFINED LOGIC: Check by ID + isGift status
      const productIsGift = product.isGift === true;
      const existingItem = cart.find(item => 
        item.id === productId &&
        (item.isGift === true) === productIsGift
      );
      
      if (existingItem) {
        if (existingItem.quantity < product.stock) {
          existingItem.quantity++;
          showToast(`${product.name} додано до кошика`);
        } else {
          showToast('Досягнуто максимальну кількість', 'warning');
        }
      } else {
        cart.push({ 
          ...product, 
          quantity: 1,
          isGift: productIsGift // Ensure boolean
        });
        showToast(`${product.name} додано до кошика`);
      }
      
      saveCart();
      renderCart();
    }

    // Remove item from cart (LEGACY)
    function removeItem(productId) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      
      // Animate out
      const element = document.querySelector(`[data-id="${productId}"]`);
      if (element) {
        element.classList.remove('cart-item-enter');
        element.classList.add('cart-item-exit');
        
        setTimeout(() => {
          cart = cart.filter(i => i.id !== productId);
          saveCart();
          renderCart();
          showToast(`${item.name} видалено`);
        }, 280);
      }
    }
    
    // Remove item by cart index (NEW)
    function removeItemByIndex(cartIndex) {
      if (cartIndex < 0 || cartIndex >= cart.length) return;
      
      const item = cart[cartIndex];
      const element = document.querySelector(`[data-cart-index="${cartIndex}"]`);
      
      if (element) {
        element.classList.remove('cart-item-enter');
        element.classList.add('cart-item-exit');
        
        setTimeout(() => {
          cart.splice(cartIndex, 1);
          saveCart();
          renderCart();
          showToast(`${item.name} видалено`);
        }, 280);
      }
    }

    // Update quantity (LEGACY)
    function updateQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      
      // Заборонити зміну кількості подарунків
      if (item.isGift === true) {
        showToast('Кількість подарунків не можна змінити', 'warning');
        return;
      }
      
      const newQty = item.quantity + delta;
      
      if (newQty < 1) {
        removeItem(productId);
        return;
      }
      
      if (newQty > item.stock) {
        showToast('Досягнуто максимальну кількість', 'warning');
        return;
      }
      
      item.quantity = newQty;
      saveCart();
      renderCart();
    }
    
    // Update quantity by index (NEW)
    function updateQtyByIndex(cartIndex, delta) {
      if (cartIndex < 0 || cartIndex >= cart.length) return;
      
      const item = cart[cartIndex];
      
      // Заборонити зміну кількості подарунків
      if (item.isGift === true) {
        showToast('Кількість подарунків не можна змінити', 'warning');
        return;
      }
      
      const newQty = item.quantity + delta;
      
      if (newQty < 1) {
        removeItemByIndex(cartIndex);
        return;
      }
      
      if (newQty > item.stock) {
        showToast('Досягнуто максимальну кількість', 'warning');
        return;
      }
      
      item.quantity = newQty;
      saveCart();
      renderCart();
    }

    // Show toast notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      
      const toast = document.createElement('div');
      toast.className = `toast-enter px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2 ${
        type === 'success' ? 'bg-gray-900 text-white' : 'bg-orange-500 text-white'
      }`;
      
      const icon = type === 'success' ? '✓' : '⚠️';
      toast.innerHTML = `<span>${icon}</span><span class="text-sm font-medium">${message}</span>`;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Close cart
    function closeCart() {
      showToast('Кошик закрито');
    }

    // Go shopping
    function goShopping() {
      showToast('Перехід до каталогу...');
    }

    // Checkout
    function checkout() {
      const total = calculateTotal();
      if (total < 100) {
        showToast('Мінімальна сума — 100 грн', 'warning');
        return;
      }
      showToast('Переходимо до оформлення...');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadCart();
      
      // Register cashback state change listener
      onCashbackStateChange((isEnabled, cashbackPercent) => {
        console.log('🔄 [Cart] Cashback state changed:', { 
          enabled: isEnabled, 
          percent: cashbackPercent 
        });
        
        // ⚡ Toggle UI elements visibility
        toggleCashbackUI(isEnabled);
        
        // Re-render cart to update calculations
        updateUI();
      });
      
      // Additional safety check: Force badges to show if cart has items
      setTimeout(() => {
        const cart = JSON.parse(localStorage.getItem('latiao_cart') || '[]');
        if (cart.length > 0) {
          const summaryBadge = document.getElementById('cashback-summary-badge');
          const cartBadge = document.getElementById('cashback-badge-cart');
          
          // Only show if cashback is enabled
          if (window.cashbackEnabled !== false) {
            if (summaryBadge) {
              summaryBadge.classList.remove('hidden');
              console.log('🔧 Safety check: Forced cashback-summary-badge visible');
            }
            if (cartBadge) {
              cartBadge.classList.remove('hidden');
              console.log('🔧 Safety check: Forced cashback-badge-cart visible');
            }
          }
        }
      }, 100);
    });
  </script>

  <!-- 📊 Visitor Device Tracking - Logs ONCE per session -->
  <script src="./js/visitor-tracker.js"></script>

  <!-- Maintenance Mode Check -->
  <script type="module" src="./js/maintenance-check.js"></script>

  <!-- Live Chat Widget -->
  <script type="module" src="./js/chat-widget.js"></script>
</body>
