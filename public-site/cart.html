  <!-- Quick Add Upsell Logic -->
  <script type="module">
    import { db } from './js/firebase-init.js';
    import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    // Import upsell display helper
    async function shouldShowUpsells(pageName) {
      try {
        const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
        const settingsDoc = await getDoc(doc(db, 'settings', 'upsellDisplayConfig'));
        
        if (settingsDoc.exists()) {
          const settings = settingsDoc.data();
          const pageMap = {
            'productPage': 'showOnProductPage',
            'cart': 'showOnCart',
            'checkout': 'showOnCheckout',
            'thankYou': 'showOnThankYou'
          };
          return settings[pageMap[pageName]] === true;
        }
        
        return false;
      } catch (error) {
        console.error('Error checking upsell settings:', error);
        return false;
      }
    }

    // Random copywriting phrases
    const UPSELL_PHRASES = [
      "Смачне доповнення",
      "Вам точно сподобається",
      "Маленький бонус для настрою",
      "Додайте до замовлення",
      "Рекомендуємо спробувати"
    ];

    // Initialize Quick Add Upsell
    async function initCartQuickAddUpsell() {
      try {
        console.error('[DEBUG] Starting initCartQuickAddUpsell...');
        
        // Task 1: Check admin setting
        const shouldShow = await shouldShowUpsells('cart');
        console.error('[DEBUG] shouldShow result:', shouldShow);
        
        if (!shouldShow) {
          console.error('[DEBUG] Cart upsells disabled by admin');
          return;
        }

        // Task 2: Fetch upsell rules for cart placement
        console.error('[DEBUG] Fetching cart upsell rules from Firestore...');
        const upsellsQuery = query(
          collection(db, 'upsells'),
          where('placementType', '==', 'cart'),
          where('isActive', '==', true)
        );
        
        const upsellSnapshot = await getDocs(upsellsQuery);
        console.error('[DEBUG] Cart upsell rules found:', upsellSnapshot.size);
        
        if (upsellSnapshot.empty) {
          console.error('[DEBUG] No active upsell rules for cart placement');
          return;
        }

        // Collect all suggested product IDs from all cart upsell rules
        const suggestedProductIds = [];
        upsellSnapshot.forEach(doc => {
          const upsell = doc.data();
          if (upsell.suggestedIds && Array.isArray(upsell.suggestedIds)) {
            suggestedProductIds.push(...upsell.suggestedIds);
          }
        });

        console.error('[DEBUG] Total suggested product IDs:', suggestedProductIds.length);

        if (suggestedProductIds.length === 0) {
          console.error('[DEBUG] No suggested products in upsell rules');
          return;
        }

        // Task 3: Fetch the actual products
        const productsQuery = query(
          collection(db, 'products'),
          where('stock', '>', 0),
          where('isActive', '==', true)
        );
        
        const snapshot = await getDocs(productsQuery);
        console.error('[DEBUG] Products found:', snapshot.size);
        
        if (snapshot.empty) {
          console.error('[DEBUG] No products available');
          return;
        }

        // Get current cart items
        const cartData = localStorage.getItem('latiao_cart');
        const cart = cartData ? JSON.parse(cartData) : [];
        const cartProductIds = cart.map(item => item.id);

        // Filter: only suggested products, not in cart, with stock
        const availableProducts = [];
        snapshot.forEach(doc => {
          const product = { id: doc.id, ...doc.data() };
          if (suggestedProductIds.includes(product.id) && !cartProductIds.includes(product.id)) {
            availableProducts.push(product);
          }
        });

        console.error('[DEBUG] Available products after filter:', availableProducts.length);
        
        if (availableProducts.length === 0) {
          console.error('[DEBUG] All suggested products already in cart or unavailable');
          return;
        }

        // Select random product from suggested ones
        const randomProduct = availableProducts[Math.floor(Math.random() * availableProducts.length)];
        console.error('[DEBUG] Selected product:', randomProduct.name);
        
        // Find the upsell rule for discount
        let discount = 5; // Default 5%
        upsellSnapshot.forEach(doc => {
          const upsell = doc.data();
          if (upsell.suggestedIds && upsell.suggestedIds.includes(randomProduct.id)) {
            discount = upsell.discount || 5;
          }
        });
        
        // Calculate discount
        const originalPrice = randomProduct.price;
        const discountedPrice = Math.round(originalPrice * (1 - discount / 100));
        console.error('[DEBUG] Prices - Original:', originalPrice, 'Discount:', discount + '%', 'Final:', discountedPrice);

        // Task 3: Render UI
        console.error('[DEBUG] Calling renderQuickAddUpsell...');
        renderQuickAddUpsell(randomProduct, originalPrice, discountedPrice);

      } catch (error) {
        console.error('Error initializing cart upsell:', error);
      }ole.error('[DEBUG] renderQuickAddUpsell called with product:', product.name);
      const container = document.getElementById('quick-add-upsell');
      console.error('[DEBUG] Container found:', !!container
    }

    // Task 3 & 4: Render compact horizontal card
    function renderQuickAddUpsell(product, originalPrice, discountedPrice) {
      const container = document.getElementById('quick-add-upsell');
      if (!container) return;

      // Random phrase
      const phrase = UPSELL_PHRASES[Math.floor(Math.random() * UPSELL_PHRASES.length)];

      // Render spiciness
      const spiciness = '🌶️'.repeat(product.spiciness || 0);

      container.innerHTML = `
        <div class="cart-item-enter bg-amber-50/50 border border-amber-100 rounded-xl p-3 flex items-center justify-between gap-3 shadow-sm hover:shadow-md transition-shadow">
          <!-- Left: Image & Info -->
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <img 
              src="${product.image}" 
              alt="${product.name}" 
              class="w-15 h-15 rounded-lg object-cover flex-shrink-0 bg-white"
            />
            <div class="flex-1 min-w-0">
              <p class="text-xs text-amber-600 font-medium">${phrase}</p>
              <h3 class="font-bold text-sm text-gray-900 truncate">${product.name}</h3>
              ${spiciness ? `<p class="text-xs mt-0.5">${spiciness}</p>` : ''}
            </div>
          </div>

          <!-- Right: Price & Button -->
          <div class="flex items-center gap-3 flex-shrink-0">
            <div class="text-right">
              <p class="text-xs text-gray-400 line-through">${originalPrice}₴</p>
              <p class="text-lg font-bold text-amber-600">${discountedPrice}₴</p>
            </div>
            <button 
              onclick="addUpsellToCart('${product.id}', '${product.name}', ${discountedPrice}, '${product.image}', ${product.spiciness || 0}, ${product.stock})"
              class="btn-press bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold px-4 py-2 rounded-lg text-sm whitespace-nowrap transition-colors"
            >
              Додати +
            </button>
          </div>
        </div>
      `;sole.error('[DEBUG] Setting HTML and showing container');
      container.classList.remove('hidden');
      console.error('[DEBUG] Container classes after show:', container.className

      container.classList.remove('hidden');
    }

    // Add upsell to cart
    window.addUpsellToCart = function(id, name, price, image, spiciness, stock) {
      // Get current cart
      const cartData = localStorage.getItem('latiao_cart');
      const cart = cartData ? JSON.parse(cartData) : [];

      // Check if already in cart
      const existingItem = cart.find(item => item.id === id);
      if (existingItem) {
        existingItem.quantity += 1;
        showToast('Кількість оновлено');
      } else {
        cart.push({
          id,
          name,
          price,
          image,
          spiciness,
          stock,
          quantity: 1
        });
        showToast('Товар додано до кошика');
      }

      // Save cart
      localStorage.setItem('latiao_cart', JSON.stringify(cart));

      // Hide upsell
      const container = document.getElementById('quick-add-upsell');
      if (container) {
        container.classList.add('cart-item-exit');
        setTimeout(() => {
          container.classList.add('hidden');
          container.classList.remove('cart-item-exit');
        }, 300);
      }

      // Reload cart display
      if (typeof loadCart === 'function') {
        loadCart();
      }
    };

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Small delay to ensure cart loads first
      setTimeout(initCartQuickAddUpsell, 500);
    });
  </script>

  <script>
    // Demo Products
    const DEMO_PRODUCTS = [
      {
        id: 1,
        name: 'Latiao Classic Spicy',
        price: 89,
        image: '/placeholder.svg?height=100&width=100',
        spiciness: 2,
        stock: 10
      },
      {
        id: 2,
        name: 'Latiao Extra Hot',
        price: 99,
        image: '/placeholder.svg?height=100&width=100',
        spiciness: 3,
        stock: 5
      },
      {
        id: 3,
        name: 'Latiao Mild Flavor',
        price: 79,
        image: '/placeholder.svg?height=100&width=100',
        spiciness: 1,
        stock: 15
      },
      {
        id: 4,
        name: 'Latiao Party Pack',
        price: 249,
        image: '/placeholder.svg?height=100&width=100',
        spiciness: 2,
        stock: 3
      }
    ];

    // Cart State
    let cart = [];

    // Load cart from localStorage
    function loadCart() {
      const saved = localStorage.getItem('latiao_cart');
      if (saved) {
        cart = JSON.parse(saved);
      } else {
        // Initialize with demo items
        cart = [
          { ...DEMO_PRODUCTS[0], quantity: 2 },
          { ...DEMO_PRODUCTS[1], quantity: 1 },
          { ...DEMO_PRODUCTS[3], quantity: 1 }
        ];
        saveCart();
      }
      renderCart();
    }

    // Save cart to localStorage
    function saveCart() {
      localStorage.setItem('latiao_cart', JSON.stringify(cart));
    }

    // Calculate totals
    function calculateTotal() {
      return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }

    function calculateItemsCount() {
      return cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    // Update UI
    function updateUI() {
      const total = calculateTotal();
      const itemsCount = calculateItemsCount();
      
      // Update summary with null checks
      const itemsCountEl = document.getElementById('items-count');
      const subtotalEl = document.getElementById('subtotal');
      const totalEl = document.getElementById('total');
      
      if (itemsCountEl) itemsCountEl.textContent = itemsCount;
      if (subtotalEl) subtotalEl.textContent = `${total} грн`;
      if (totalEl) totalEl.textContent = `${total} грн`;
      
      // Update delivery cost
      const deliveryCost = document.getElementById('delivery-cost');
      if (deliveryCost) {
        if (total >= 1100) {
          deliveryCost.textContent = 'Безкоштовно';
          deliveryCost.classList.add('text-green-600');
          deliveryCost.classList.remove('text-gray-700');
        } else {
          deliveryCost.textContent = 'Від 70 грн';
          deliveryCost.classList.remove('text-green-600');
          deliveryCost.classList.add('text-gray-700');
        }
      }
      
      // Update minimum order notice
      const minNotice = document.getElementById('min-order-notice');
      if (minNotice) {
        if (total >= 100 || cart.length === 0) {
          minNotice.classList.add('hidden');
        } else {
          minNotice.classList.remove('hidden');
        }
      }
      
      // Update delivery progress bar
      const deliveryBar = document.getElementById('delivery-bar');
      if (deliveryBar) {
        const progressPercent = Math.min((total / 1100) * 100, 100);
        deliveryBar.style.width = `${progressPercent}%`;
      }
      
      const deliveryText = document.getElementById('delivery-text');
      const deliveryAmount = document.getElementById('delivery-amount');
      
      if (deliveryText && deliveryAmount) {
        if (total >= 1100) {
          deliveryText.textContent = '🎉 У вас безкоштовна доставка!';
          deliveryAmount.textContent = '';
        } else {
          const remaining = 1100 - total;
          deliveryText.textContent = 'До безкоштовної доставки';
          deliveryAmount.textContent = `${remaining} грн`;
        }
      }
      
      // Update checkout button
      const checkoutBtn = document.getElementById('checkout-btn');
      if (checkoutBtn) {
        if (cart.length === 0 || total < 100) {
          checkoutBtn.disabled = true;
          checkoutBtn.classList.remove('pulse-animation');
        } else {
          checkoutBtn.disabled = false;
          checkoutBtn.classList.add('pulse-animation');
        }
      }
      
      // Show/hide empty state
      const emptyState = document.getElementById('empty-state');
      const cartItems = document.getElementById('cart-items');
      const cartSummary = document.getElementById('cart-summary');
      const deliveryProgress = document.getElementById('delivery-progress');
      
      if (cart.length === 0) {
        if (emptyState) emptyState.classList.remove('hidden');
        if (cartItems) cartItems.classList.add('hidden');
        if (cartSummary) cartSummary.classList.add('hidden');
        if (deliveryProgress) deliveryProgress.classList.add('hidden');
      } else {
        if (emptyState) emptyState.classList.add('hidden');
        if (cartItems) cartItems.classList.remove('hidden');
        if (cartSummary) cartSummary.classList.remove('hidden');
        if (deliveryProgress) deliveryProgress.classList.remove('hidden');
      }
    }

    // Render spiciness
    function renderSpiciness(level) {
      return '🌶️'.repeat(level);
    }

    // Render cart items
    function renderCart() {
      const container = document.getElementById('cart-items');
      
      container.innerHTML = cart.map((item, cartIndex) => {
        const isGift = item.isGift === true;
        
        return `
        <div class="cart-item-enter card-hover bg-white border border-gray-100 rounded-3xl p-4 shadow-sm ${isGift ? 'border-green-200 bg-green-50/30' : ''}" data-cart-index="${cartIndex}">
          ${isGift ? '<div class="absolute top-2 right-2 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-full">🎁 Подарунок</div>' : ''}
          <div class="flex gap-4">
            <!-- Product Image -->
            <div class="w-20 h-20 flex-shrink-0 bg-orange-50 rounded-2xl overflow-hidden ${isGift ? 'ring-2 ring-green-400' : ''}">
              <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
            </div>
            
            <!-- Product Info -->
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <h3 class="font-bold text-gray-900 truncate">${item.name}</h3>
                  ${isGift ? '<p class="text-xs text-green-600 font-semibold mt-0.5">🎁 Подарунок від Latiao Snack</p>' : `<p class="text-xs mt-0.5">${renderSpiciness(item.spiciness)}</p>`}
                </div>
                <button onclick="removeItemByIndex(${cartIndex})" class="btn-press flex-shrink-0 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
              
              <div class="flex items-center justify-between mt-3">
                <!-- Quantity Controls -->
                ${!isGift ? `
                <div class="flex items-center gap-1 bg-gray-100 rounded-xl p-1">
                  <button onclick="updateQtyByIndex(${cartIndex}, -1)" class="qty-btn w-8 h-8 rounded-lg bg-white flex items-center justify-center font-bold text-gray-600 shadow-sm">
                    −
                  </button>
                  <span class="w-8 text-center font-bold text-gray-900">${item.quantity}</span>
                  <button onclick="updateQtyByIndex(${cartIndex}, 1)" ${item.quantity >= item.stock ? 'disabled' : ''} class="qty-btn w-8 h-8 rounded-lg bg-white flex items-center justify-center font-bold text-gray-600 shadow-sm">
                    +
                  </button>
                </div>
                ` : `
                <div class="text-sm text-green-600 font-semibold">Безкоштовно</div>
                `}
                
                <!-- Price -->
                <div class="text-right">
                  <p class="text-lg font-extrabold ${isGift ? 'text-green-600' : 'text-primary'}">${isGift ? '0 грн' : (item.price * item.quantity) + ' грн'}</p>
                  ${item.quantity > 1 && !isGift ? `<p class="text-xs text-gray-400">${item.price} грн/шт</p>` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      }).join('');
      
      updateUI();
    }

    // Add item to cart
    function addItem(productId) {
      const product = DEMO_PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      
      // REFINED LOGIC: Check by ID + isGift status
      const productIsGift = product.isGift === true;
      const existingItem = cart.find(item => 
        item.id === productId &&
        (item.isGift === true) === productIsGift
      );
      
      if (existingItem) {
        if (existingItem.quantity < product.stock) {
          existingItem.quantity++;
          showToast(`${product.name} додано до кошика`);
        } else {
          showToast('Досягнуто максимальну кількість', 'warning');
        }
      } else {
        cart.push({ 
          ...product, 
          quantity: 1,
          isGift: productIsGift // Ensure boolean
        });
        showToast(`${product.name} додано до кошика`);
      }
      
      saveCart();
      renderCart();
    }

    // Remove item from cart (LEGACY)
    function removeItem(productId) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      
      // Animate out
      const element = document.querySelector(`[data-id="${productId}"]`);
      if (element) {
        element.classList.remove('cart-item-enter');
        element.classList.add('cart-item-exit');
        
        setTimeout(() => {
          cart = cart.filter(i => i.id !== productId);
          saveCart();
          renderCart();
          showToast(`${item.name} видалено`);
        }, 280);
      }
    }
    
    // Remove item by cart index (NEW)
    function removeItemByIndex(cartIndex) {
      if (cartIndex < 0 || cartIndex >= cart.length) return;
      
      const item = cart[cartIndex];
      const element = document.querySelector(`[data-cart-index="${cartIndex}"]`);
      
      if (element) {
        element.classList.remove('cart-item-enter');
        element.classList.add('cart-item-exit');
        
        setTimeout(() => {
          cart.splice(cartIndex, 1);
          saveCart();
          renderCart();
          showToast(`${item.name} видалено`);
        }, 280);
      }
    }

    // Update quantity (LEGACY)
    function updateQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      
      // Заборонити зміну кількості подарунків
      if (item.isGift === true) {
        showToast('Кількість подарунків не можна змінити', 'warning');
        return;
      }
      
      const newQty = item.quantity + delta;
      
      if (newQty < 1) {
        removeItem(productId);
        return;
      }
      
      if (newQty > item.stock) {
        showToast('Досягнуто максимальну кількість', 'warning');
        return;
      }
      
      item.quantity = newQty;
      saveCart();
      renderCart();
    }
    
    // Update quantity by index (NEW)
    function updateQtyByIndex(cartIndex, delta) {
      if (cartIndex < 0 || cartIndex >= cart.length) return;
      
      const item = cart[cartIndex];
      
      // Заборонити зміну кількості подарунків
      if (item.isGift === true) {
        showToast('Кількість подарунків не можна змінити', 'warning');
        return;
      }
      
      const newQty = item.quantity + delta;
      
      if (newQty < 1) {
        removeItemByIndex(cartIndex);
        return;
      }
      
      if (newQty > item.stock) {
        showToast('Досягнуто максимальну кількість', 'warning');
        return;
      }
      
      item.quantity = newQty;
      saveCart();
      renderCart();
    }

    // Show toast notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      
      const toast = document.createElement('div');
      toast.className = `toast-enter px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2 ${
        type === 'success' ? 'bg-gray-900 text-white' : 'bg-orange-500 text-white'
      }`;
      
      const icon = type === 'success' ? '✓' : '⚠️';
      toast.innerHTML = `<span>${icon}</span><span class="text-sm font-medium">${message}</span>`;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Close cart
    function closeCart() {
      showToast('Кошик закрито');
    }

    // Go shopping
    function goShopping() {
      showToast('Перехід до каталогу...');
    }

    // Checkout
    function checkout() {
      const total = calculateTotal();
      if (total < 100) {
        showToast('Мінімальна сума — 100 грн', 'warning');
        return;
      }
      showToast('Переходимо до оформлення...');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', loadCart);
  </script>

  <!-- 📊 Visitor Device Tracking - Logs ONCE per session -->
  <script src="./js/visitor-tracker.js"></script>

  <!-- Maintenance Mode Check -->
  <script type="module" src="./js/maintenance-check.js"></script>

  <!-- Live Chat Widget -->
  <script type="module" src="./js/chat-widget.js"></script>
</body>
</html>
