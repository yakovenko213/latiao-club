<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Analytics Favorites</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      font-weight: 500;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    #console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
      line-height: 1.6;
    }
    .log-success { color: #4ec9b0; }
    .log-error { color: #f48771; }
    .log-info { color: #569cd6; }
    .log-timestamp { color: #6a737d; font-size: 11px; }
    pre { margin: 5px 0; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔥 Test Analytics Favorites Sync</h1>
    <p>This test will create a document in the <code>analytics_favorites</code> collection.</p>
    
    <div id="status" class="status info">
      ⏳ Ready to test. Click the button below.
    </div>
    
    <button onclick="testAnalyticsSync()">🚀 Test Analytics Sync</button>
    
    <div id="console"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, setDoc, increment, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDyQvItRyL4IKl9NmEItswwPOEiKAbWkMw",
      authDomain: "my-magazin-81c96.firebaseapp.com",
      projectId: "my-magazin-81c96",
      storageBucket: "my-magazin-81c96.firebasestorage.app",
      messagingSenderId: "129061757346",
      appId: "1:129061757346:web:3e7bc5838cc5f7bda992fb"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Console logging
    const consoleDiv = document.getElementById('console');
    const statusDiv = document.getElementById('status');

    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString('uk-UA');
      const colors = {
        info: 'log-info',
        success: 'log-success',
        error: 'log-error'
      };
      consoleDiv.innerHTML += `
        <div>
          <span class="log-timestamp">[${timestamp}]</span>
          <span class="${colors[type]}">${message}</span>
        </div>
      `;
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    // Test function
    window.testAnalyticsSync = async function() {
      consoleDiv.innerHTML = '';
      statusDiv.className = 'status info';
      statusDiv.textContent = '⏳ Testing...';
      
      log('🚀 Starting analytics sync test...', 'info');
      log('📍 Domain: ' + window.location.hostname, 'info');
      log('🔥 Firebase Project: ' + firebaseConfig.projectId, 'info');
      
      try {
        // Test product data
        const testProductId = 'TEST_' + Date.now();
        const analyticsData = {
          productId: testProductId,
          title: 'Тестовий продукт - Гострий соус',
          price: 299,
          image: '/images/test.jpg',
          sku: 'TEST-SKU-001',
          addedCount: increment(1),
          lastAddedAt: serverTimestamp()
        };
        
        log('📦 Test product ID: ' + testProductId, 'info');
        log('📊 Preparing analytics data...', 'info');
        log('<pre>' + JSON.stringify(analyticsData, null, 2) + '</pre>', 'info');
        
        log('💾 Creating Firestore document reference...', 'info');
        const analyticsRef = doc(db, 'analytics_favorites', testProductId);
        
        log('🔄 Writing to Firestore...', 'info');
        await setDoc(analyticsRef, analyticsData, { merge: true });
        
        log('✅ Success! Document created in analytics_favorites collection!', 'success');
        log('🔗 Document ID: ' + testProductId, 'success');
        
        statusDiv.className = 'status success';
        statusDiv.innerHTML = `
          ✅ <strong>Success!</strong> Analytics data was successfully written to Firestore.<br>
          📄 Document ID: <code>${testProductId}</code><br>
          📍 Collection: <code>analytics_favorites</code><br><br>
          <a href="https://console.firebase.google.com/project/my-magazin-81c96/firestore/data/analytics_favorites/${testProductId}" 
             target="_blank" 
             style="color: #155724; text-decoration: underline;">
            🔗 View in Firebase Console
          </a>
        `;
        
        log('', 'info');
        log('🎯 Next steps:', 'info');
        log('1. Check Firebase Console to verify the document exists', 'info');
        log('2. Test on your live website by clicking heart icons', 'info');
        log('3. Check admin panel "❤️ Обране клієнтів" section', 'info');
        
      } catch (error) {
        log('❌ Error occurred!', 'error');
        log('Error code: ' + error.code, 'error');
        log('Error message: ' + error.message, 'error');
        log('Full error: ' + error.stack, 'error');
        
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `
          ❌ <strong>Error!</strong> ${error.message}<br>
          Code: <code>${error.code}</code><br><br>
          ${error.code === 'permission-denied' ? 
            '💡 <strong>Fix:</strong> Run <code>firebase deploy --only firestore:rules</code>' : 
            '💡 Check the console output above for details'}
        `;
      }
    };

    // Auto-run test on page load
    log('🔧 Firebase initialized', 'success');
    log('📋 Ready to test. Click the button above.', 'info');
  </script>
</body>
</html>
