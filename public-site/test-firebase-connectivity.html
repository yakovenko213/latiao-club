<!DOCTYPE html>
<html lang="uk">
<head>
<!-- Google Analytics (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KE8MZNKEYH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KE8MZNKEYH');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Connectivity Diagnostics</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8">🔧 Firebase Connectivity Diagnostics</h1>
    
    <div id="results" class="space-y-4"></div>
    
    <button 
      onclick="runDiagnostics()" 
      class="mt-6 bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700">
      Run Diagnostics
    </button>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDyQvItRyL4IKl9NmEItswwPOEiKAbWkMw",
      authDomain: "my-magazin-81c96.firebaseapp.com",
      projectId: "my-magazin-81c96",
      storageBucket: "my-magazin-81c96.firebasestorage.app",
      messagingSenderId: "129061757346",
      appId: "1:129061757346:web:3e7bc5838cc5f7bda992fb"
    };

    let app, db;
    
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (error) {
      console.error('Firebase initialization failed:', error);
    }

    function addResult(title, status, message, duration = null) {
      const resultsDiv = document.getElementById('results');
      const statusColors = {
        success: 'bg-green-100 border-green-500 text-green-800',
        error: 'bg-red-100 border-red-500 text-red-800',
        warning: 'bg-yellow-100 border-yellow-500 text-yellow-800',
        info: 'bg-blue-100 border-blue-500 text-blue-800'
      };

      const statusIcons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
      };

      const html = `
        <div class="border-l-4 p-4 rounded ${statusColors[status]}">
          <div class="flex items-start">
            <span class="text-2xl mr-3">${statusIcons[status]}</span>
            <div class="flex-1">
              <h3 class="font-bold">${title}</h3>
              <p class="mt-1">${message}</p>
              ${duration ? `<p class="text-sm mt-1">⏱️ Time: ${duration}ms</p>` : ''}
            </div>
          </div>
        </div>
      `;
      
      resultsDiv.insertAdjacentHTML('beforeend', html);
    }

    async function runDiagnostics() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p class="text-gray-600">Running diagnostics...</p>';
      
      // Test 1: Check current domain
      const currentDomain = window.location.hostname;
      addResult(
        'Current Domain',
        'info',
        `You are accessing from: <strong>${currentDomain}</strong>`
      );

      // Test 2: Check if HTTPS
      const isHttps = window.location.protocol === 'https:';
      addResult(
        'SSL/HTTPS Check',
        isHttps ? 'success' : 'error',
        isHttps ? 'Site is using HTTPS ✓' : 'Site is using HTTP - this may cause security issues!'
      );

      // Test 3: Check Firestore connectivity
      try {
        const start = performance.now();
        const testQuery = query(
          collection(db, 'products'),
          where('isVisible', '==', true),
          limit(1)
        );
        const snapshot = await getDocs(testQuery);
        const duration = Math.round(performance.now() - start);
        
        addResult(
          'Firestore Connection',
          'success',
          `Successfully connected to Firestore! Found ${snapshot.size} product(s).`,
          duration
        );
      } catch (error) {
        addResult(
          'Firestore Connection',
          'error',
          `Failed to connect: ${error.message}`
        );
      }

      // Test 4: Check Categories
      try {
        const start = performance.now();
        const categoriesQuery = query(
          collection(db, 'categories'),
          where('isActive', '==', true),
          limit(10)
        );
        const snapshot = await getDocs(categoriesQuery);
        const duration = Math.round(performance.now() - start);
        
        addResult(
          'Categories Query',
          'success',
          `Found ${snapshot.size} active categories.`,
          duration
        );
      } catch (error) {
        addResult(
          'Categories Query',
          'error',
          `Failed to fetch categories: ${error.message}`
        );
      }

      // Test 5: Check All Products Count
      try {
        const start = performance.now();
        const productsSnapshot = await getDocs(collection(db, 'products'));
        const duration = Math.round(performance.now() - start);
        
        const visibleProducts = [];
        productsSnapshot.forEach(doc => {
          const data = doc.data();
          if (data.isVisible !== false) {
            visibleProducts.push(doc.id);
          }
        });
        
        addResult(
          'Products Count',
          productsSnapshot.size >= 60 ? 'success' : 'warning',
          `Total products: ${productsSnapshot.size}, Visible: ${visibleProducts.length}`,
          duration
        );
      } catch (error) {
        addResult(
          'Products Count',
          'error',
          `Failed to count products: ${error.message}`
        );
      }

      // Test 6: Check Mixed Content
      const hasInsecureResources = document.querySelectorAll('script[src^="http:"], link[href^="http:"], img[src^="http:"]').length > 0;
      addResult(
        'Mixed Content Check',
        hasInsecureResources ? 'warning' : 'success',
        hasInsecureResources 
          ? 'Found resources loaded via HTTP - this may cause issues on HTTPS!' 
          : 'All resources are loaded via HTTPS ✓'
      );

      // Test 7: Check CORS
      addResult(
        'CORS Status',
        'info',
        'If previous tests passed, CORS is configured correctly. If not, check Firebase Console → Authentication → Authorized Domains.'
      );

      // Test 8: Authorized Domains Reminder
      const expectedDomains = [
        'localhost',
        'latiao-snack.com.ua',
        'my-magazin-81c96.web.app',
        'my-magazin-81c96.firebaseapp.com'
      ];
      
      const isAuthorized = expectedDomains.some(domain => 
        currentDomain === domain || currentDomain.endsWith('.' + domain)
      );
      
      addResult(
        'Domain Authorization',
        isAuthorized ? 'success' : 'warning',
        isAuthorized 
          ? `Domain ${currentDomain} is in the expected list ✓` 
          : `⚠️ Domain ${currentDomain} may not be authorized. Add it to Firebase Console → Authentication → Settings → Authorized domains`
      );

      addResult(
        'Diagnostics Complete',
        'success',
        'All tests completed. Check results above.'
      );
    }

    // Expose function globally
    window.runDiagnostics = runDiagnostics;
  </script>
</body>
</html>
