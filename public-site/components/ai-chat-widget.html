<!-- ============================================
     AI CHAT WIDGET - Floating Chat Button
     Include this snippet before </body> on every page
     ============================================ -->

<!-- Chat Button -->
<button 
  id="ai-chat-button" 
  class="fixed bottom-6 right-6 z-50 w-16 h-16 bg-gradient-to-br from-[#ff6b00] to-[#ff4444] rounded-full shadow-2xl hover:scale-110 transition-all duration-300 flex items-center justify-center group"
  aria-label="Open AI Chat"
>
  <img 
    src="images/chat-icon.png" 
    alt="Chat" 
    class="w-8 h-8 group-hover:scale-110 transition-transform"
    onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-2xl\'>💬</span>'"
  />
  <!-- Notification Badge (Optional) -->
  <span class="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-white animate-pulse"></span>
</button>

<!-- Chat Window (Hidden by default) -->
<div 
  id="ai-chat-window" 
  class="hidden fixed bottom-24 right-6 z-50 w-80 sm:w-96 h-[500px] bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden"
>
  <!-- Chat Header -->
  <div class="bg-gradient-to-r from-[#ff6b00] to-[#ff4444] p-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
        <span class="text-2xl">🤖</span>
      </div>
      <div>
        <h3 class="text-white font-bold text-lg">AI Помічник</h3>
        <p class="text-white/80 text-xs">Завжди онлайн</p>
      </div>
    </div>
    <button 
      id="close-chat" 
      class="text-white hover:bg-white/20 rounded-lg p-2 transition-colors"
      aria-label="Close chat"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Chat Body -->
  <div class="flex-1 p-4 overflow-y-auto bg-gray-50">
    <div class="space-y-3">
      <!-- Welcome Message -->
      <div class="flex gap-2">
        <div class="w-8 h-8 bg-gradient-to-br from-[#ff6b00] to-[#ff4444] rounded-full flex items-center justify-center flex-shrink-0">
          <span class="text-sm">🤖</span>
        </div>
        <div class="bg-white rounded-2xl rounded-tl-none px-4 py-3 shadow-sm max-w-[75%]">
          <p class="text-gray-800 text-sm">
            Вітаю! 👋 Я AI помічник Latiao Snack. Чим можу допомогти?
          </p>
        </div>
      </div>
      
      <!-- Quick Actions -->
      <div class="space-y-2">
        <p class="text-xs text-gray-500 font-medium">Популярні запити:</p>
        <button class="w-full text-left bg-white hover:bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-700 shadow-sm transition-colors">
          📦 Статус мого замовлення
        </button>
        <button class="w-full text-left bg-white hover:bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-700 shadow-sm transition-colors">
          🌶️ Рекомендації товарів
        </button>
        <button class="w-full text-left bg-white hover:bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-700 shadow-sm transition-colors">
          💰 Як використати промокод?
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Footer (Input) -->
  <div class="p-4 border-t border-gray-200 bg-white">
    <div class="flex gap-2">
      <input 
        type="text" 
        id="chat-input"
        placeholder="Напишіть повідомлення..." 
        class="flex-1 px-4 py-2 border border-gray-300 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-[#ff6b00] focus:border-transparent"
      />
      <button 
        id="send-message"
        class="bg-gradient-to-r from-[#ff6b00] to-[#ff4444] text-white rounded-full p-2 hover:scale-105 transition-transform"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- AI Chat Toggle Script -->
<script>
  (function() {
    // Toggle AI Chat Window
    const chatButton = document.getElementById('ai-chat-button');
    const chatWindow = document.getElementById('ai-chat-window');
    const closeChat = document.getElementById('close-chat');
    const chatInput = document.getElementById('chat-input');
    const sendMessage = document.getElementById('send-message');

    if (!chatButton || !chatWindow || !closeChat) return;

    // Open/close chat
    chatButton.addEventListener('click', (e) => {
      e.stopPropagation();
      chatWindow.classList.toggle('hidden');
      
      // Focus input when opening
      if (!chatWindow.classList.contains('hidden')) {
        chatWindow.style.animation = 'fadeIn 0.3s ease-out';
        setTimeout(() => chatInput?.focus(), 100);
      }
    });

    // Close chat button
    closeChat.addEventListener('click', (e) => {
      e.stopPropagation();
      chatWindow.classList.add('hidden');
    });

    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!chatWindow.contains(e.target) && !chatButton.contains(e.target)) {
        chatWindow.classList.add('hidden');
      }
    });

    // Prevent closing when clicking inside chat
    chatWindow.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Send message on Enter key
    if (chatInput) {
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && chatInput.value.trim()) {
          // TODO: Implement message sending logic
          console.log('Message:', chatInput.value);
          chatInput.value = '';
        }
      });
    }

    // Send message on button click
    if (sendMessage) {
      sendMessage.addEventListener('click', () => {
        if (chatInput.value.trim()) {
          // TODO: Implement message sending logic
          console.log('Message:', chatInput.value);
          chatInput.value = '';
        }
      });
    }

    // Add fadeIn animation keyframes if not already present
    if (!document.querySelector('style[data-chat-animations]')) {
      const style = document.createElement('style');
      style.setAttribute('data-chat-animations', 'true');
      style.textContent = `
        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      `;
      document.head.appendChild(style);
    }
  })();
</script>
