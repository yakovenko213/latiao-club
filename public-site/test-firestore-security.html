<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 Firestore Security Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6">
      <h1 class="text-2xl font-bold mb-4">🔒 Firestore Security Rules Test</h1>
      
      <div class="space-y-4">
        <div>
          <h2 class="font-semibold mb-2">Current Session:</h2>
          <pre id="session-info" class="bg-gray-100 p-3 rounded text-xs overflow-x-auto"></pre>
        </div>
        
        <div>
          <h2 class="font-semibold mb-2">Firebase Auth Status:</h2>
          <pre id="auth-info" class="bg-gray-100 p-3 rounded text-xs overflow-x-auto"></pre>
        </div>
        
        <button onclick="testUserAccess()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
          Test User Data Access
        </button>
        
        <button onclick="testOrdersAccess()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          Test Orders Access
        </button>
        
        <div>
          <h2 class="font-semibold mb-2">Test Results:</h2>
          <pre id="results" class="bg-gray-100 p-3 rounded text-xs overflow-x-auto min-h-[200px]"></pre>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCEQMzGUJVqnpTY-L-FvaBxD2dUX2rZJfs",
      authDomain: "my-magazin-81c96.firebaseapp.com",
      projectId: "my-magazin-81c96",
      storageBucket: "my-magazin-81c96.firebasestorage.app",
      messagingSenderId: "422663847092",
      appId: "1:422663847092:web:0f6cdee41f64f949fce01b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.db = db;
    window.auth = auth;

    // Display session info
    const sessionData = localStorage.getItem('user_session');
    if (sessionData) {
      try {
        const user = JSON.parse(sessionData);
        document.getElementById('session-info').textContent = JSON.stringify(user, null, 2);
      } catch (e) {
        document.getElementById('session-info').textContent = 'Invalid session data';
      }
    } else {
      document.getElementById('session-info').textContent = 'No session found in localStorage';
    }

    // Monitor auth state
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-info').textContent = JSON.stringify({
          uid: user.uid,
          email: user.email,
          phoneNumber: user.phoneNumber,
          displayName: user.displayName
        }, null, 2);
      } else {
        document.getElementById('auth-info').textContent = 'Not authenticated with Firebase Auth';
      }
    });

    // Test user data access
    window.testUserAccess = async function() {
      const results = document.getElementById('results');
      results.textContent = '🔍 Testing user data access...\n\n';
      
      try {
        const sessionData = localStorage.getItem('user_session');
        if (!sessionData) {
          results.textContent += '❌ No session found\n';
          return;
        }
        
        const user = JSON.parse(sessionData);
        const phone = user.phone;
        
        if (!phone) {
          results.textContent += '❌ No phone in session\n';
          return;
        }
        
        // Try to access customers collection
        const customerId = phone.replace(/\D/g, '');
        results.textContent += `📱 Trying to access customers/${customerId}...\n`;
        
        const customerRef = doc(db, 'customers', customerId);
        const customerDoc = await getDoc(customerRef);
        
        if (customerDoc.exists()) {
          results.textContent += '✅ SUCCESS! Customer data retrieved:\n';
          results.textContent += JSON.stringify(customerDoc.data(), null, 2);
        } else {
          results.textContent += '⚠️ Customer document does not exist\n';
        }
      } catch (e) {
        results.textContent += '❌ ERROR: ' + e.message + '\n';
        results.textContent += 'Code: ' + e.code + '\n';
        console.error(e);
      }
    };

    // Test orders access
    window.testOrdersAccess = async function() {
      const results = document.getElementById('results');
      results.textContent = '🔍 Testing orders access...\n\n';
      
      try {
        const sessionData = localStorage.getItem('user_session');
        if (!sessionData) {
          results.textContent += '❌ No session found\n';
          return;
        }
        
        const user = JSON.parse(sessionData);
        const phone = user.phone;
        
        if (!phone) {
          results.textContent += '❌ No phone in session\n';
          return;
        }
        
        // Normalize phone
        let normalizedPhone = phone.replace(/\D/g, '');
        if (normalizedPhone.startsWith('380')) {
          normalizedPhone = '+' + normalizedPhone;
        }
        
        results.textContent += `📱 Querying orders for phone: ${normalizedPhone}...\n\n`;
        
        // Try userId first
        const userId = phone.replace(/\D/g, '');
        results.textContent += `🔐 Trying userId: ${userId}...\n`;
        
        const ordersRef = collection(db, 'orders');
        const userIdQuery = query(
          ordersRef,
          where('userId', '==', userId)
        );
        
        const userIdSnapshot = await getDocs(userIdQuery);
        
        if (!userIdSnapshot.empty) {
          results.textContent += `✅ Found ${userIdSnapshot.size} orders by userId!\n\n`;
          userIdSnapshot.forEach((doc, idx) => {
            results.textContent += `Order ${idx + 1}: ${doc.id}\n`;
          });
        } else {
          results.textContent += '⚠️ No orders found by userId, trying phone...\n';
          
          // Try phone
          const phoneQuery = query(
            ordersRef,
            where('customer.phone', '==', normalizedPhone)
          );
          
          const phoneSnapshot = await getDocs(phoneQuery);
          
          if (!phoneSnapshot.empty) {
            results.textContent += `✅ Found ${phoneSnapshot.size} orders by phone!\n\n`;
            phoneSnapshot.forEach((doc, idx) => {
              results.textContent += `Order ${idx + 1}: ${doc.id}\n`;
            });
          } else {
            results.textContent += '❌ No orders found\n';
          }
        }
      } catch (e) {
        results.textContent += '❌ ERROR: ' + e.message + '\n';
        results.textContent += 'Code: ' + e.code + '\n';
        console.error(e);
      }
    };
  </script>
</body>
</html>
